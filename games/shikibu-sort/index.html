<!-- YouTube Playables SDK。ゲームのコードより前に読み込む決まり。YouTube の外（ローカル）では ytgame が無いか IN_PLAYABLES_ENV=false になり、下の Platform が同じ形のスタブに切り替える -->
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  @font-face { font-family: 'UIRound'; src: url('assets/ui.ttf') format('truetype'); font-weight: 900; font-display: block; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5FA9FF; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="assets/face_data.js"></script>
<script src="assets/pose_data.js"></script>
<script src="assets/sfx.js"></script>
<script src="assets/sfx_data.js"></script>
<script src="assets/bgm.js"></script>
<script src="assets/bgm_data.js" defer></script>
<script>
'use strict';
/* =====================================================================
   しきぶの在庫仕分け（仮）— v5c（表示の「面」を「ステージ」に・HUD に目安手数・クリアで星 1〜3・セーブ v4 に星）
  v5b: 音は A=木・紙で確定し A だけ同梱・効果音の ON/OFF ボタンと m キーを無効化・100 面で全クリア→101 面からエンドレス
   v5（音の刷新: 効果音ラボの録音を加工した素材＋Web Audio の揺れ・パン・残響。効果音の ON/OFF ボタン）
   v4: YouTube Playables SDK 組み込み・saveData 保存・日英
   素の HTML/JS/Canvas。外部通信なし（SDK だけは YouTube が配る）。ブラウザ保存・ページ可視性・ブラウザの言語設定は使わない（tools/build_dist.py が検査）。
   配色・文字の型・演出は docs/アートディレクション_v2.md の値。
   ===================================================================== */

// ---------- SDK のスタブ（YouTube の外で使う。本物の ytgame と同じ形・同じ戻り値の型） ----------
// window.__ytStubInit = { data, lang, audio } で初期状態を渡せる（テスト用）。言語は ?lang= でも変えられる。
// YouTube 側の出来事（一時停止・ミュート）は sdk.__stub.pause()/resume()/setAudio(bool) で起こす。
function makeStubSdk(init) {
  init = init || {};
  const subs = { pause: [], resume: [], audio: [] };
  const on = (list, cb) => { list.push(cb); return () => { const i = list.indexOf(cb); if (i >= 0) list.splice(i, 1); }; };
  const emit = (list, v) => list.slice().forEach(f => { try { f(v); } catch (e) { /* 呼び出し先の例外で止めない */ } });
  const st = { data: typeof init.data === 'string' ? init.data : '', audio: init.audio !== false, lang: init.lang || new URLSearchParams(location.search).get('lang') || 'ja', score: null };
  const fail = type => { const e = new Error(type); e.errorType = type; return Promise.reject(e); };
  const sdk = {
    IN_PLAYABLES_ENV: false, SDK_VERSION: 'stub',
    game: {
      firstFrameReady() {}, gameReady() {},
      loadData() { return Promise.resolve(st.data); },
      saveData(s) { if (typeof s !== 'string') return fail('INVALID_PARAMS'); if (s.length * 2 > 3 * 1024 * 1024) return fail('SIZE_LIMIT_EXCEEDED'); st.data = s; return Promise.resolve(); },
    },
    system: {
      getLanguage() { return Promise.resolve(st.lang); },
      isAudioEnabled() { return st.audio; },
      onAudioEnabledChange(cb) { return on(subs.audio, cb); },
      onPause(cb) { return on(subs.pause, cb); },
      onResume(cb) { return on(subs.resume, cb); },
    },
    engagement: {
      sendScore(o) { if (!o || !Number.isFinite(o.value)) return fail('INVALID_PARAMS'); st.score = Math.max(st.score || 0, o.value); return Promise.resolve(); },
      openYTContent() { return Promise.resolve(); },
    },
    health: { logError() {}, logWarning() {} },
  };
  sdk.__stub = { state: st, pause: () => emit(subs.pause), resume: () => emit(subs.resume), setAudio: v => { st.audio = !!v; emit(subs.audio, st.audio); } };
  return sdk;
}

// ---------- Platform: ゲームから SDK を呼ぶ唯一の窓口 ----------
// YouTube の中（ytgame があり IN_PLAYABLES_ENV が false でない）なら本物、それ以外はスタブ。どちらでも同じ呼び方・同じ順序になる。
// calls は呼んだ順の記録（テストで順序を確かめる）。SDK の例外や reject でゲームは止めない。
const Platform = (() => {
  const real = (typeof ytgame !== 'undefined' && ytgame && ytgame.game && ytgame.IN_PLAYABLES_ENV !== false) ? ytgame : null;
  const sdk = real || makeStubSdk(window.__ytStubInit);
  const calls = [];
  const call = (name, f, def) => { calls.push(name); try { return f(); } catch (e) { return def; } };
  const P = {
    env: real ? 'youtube' : 'stub', sdk, calls,
    firstFrameReady() { call('firstFrameReady', () => sdk.game.firstFrameReady()); },
    gameReady() { call('gameReady', () => sdk.game.gameReady()); },
    async getLanguage() { try { return String((await call('getLanguage', () => sdk.system.getLanguage(), '')) || ''); } catch (e) { return ''; } },
    async loadData() { try { const s = await call('loadData', () => sdk.game.loadData(), ''); return typeof s === 'string' ? s : ''; } catch (e) { P.logWarning(); return ''; } },
    saveData(str) { return Promise.resolve(call('saveData', () => sdk.game.saveData(str))).catch(() => P.logWarning()); },
    isAudioEnabled() { return call('isAudioEnabled', () => sdk.system.isAudioEnabled() !== false, true); },
    onAudioEnabledChange(cb) { call('onAudioEnabledChange', () => sdk.system.onAudioEnabledChange(v => cb(!!v))); },
    onPause(cb) { call('onPause', () => sdk.system.onPause(cb)); },
    onResume(cb) { call('onResume', () => sdk.system.onResume(cb)); },
    sendScore(n) { Promise.resolve(call('sendScore', () => sdk.engagement.sendScore({ value: n | 0 }))).catch(() => {}); },
    logError() { call('logError', () => sdk.health.logError()); },
    logWarning() { call('logWarning', () => sdk.health.logWarning()); },
  };
  return P;
})();
window.addEventListener('error', () => Platform.logError());

// ---------- Save: saveData/loadData に JSON 文字列 1 つで保存（面番号・ベスト手数・星・設定） ----------
// 形式 v4: { v: 4, level, best: { "面": 手数 }, stars: { "面": 1〜3 }, settings: { sfx, bgm }, allClear }（bgm は v6 で追加。無ければ ON）。v3（stars なし）・v2（allClear なし）・v3b までの { level, best } も読める。
// allClear = 最終面（FINAL_LEVEL）をクリア済みか。v2 以前のセーブで面が FINAL_LEVEL を超えていれば済みとみなす。
// stars = その面で取った星の最高（v5c）。星はその面のいちばん少ない手数だけで決まるので、v3 以前のセーブは load で best と目安から埋める。
// 壊れた・型違いのセーブは項目ごとに既定値へ落とす（落ちない）。loadData が済むまで saveData は呼ばない。
const SAVE_VER = 4;
const FINAL_LEVEL = 100;   // この面をクリアすると「全クリア」（設計要件「内容の完了を伝える」）。その後は「エンドレス 101〜」として続く
const KEY_RE = /^[1-9]\d{0,4}$/;
// 星の評価（v5c）: 手数 ≤ 目安 → 3、≤ 目安×1.5 → 2、それ以上 → 1（目安 = 生成した解の手数 par）
function starsFor(moves, par) { return moves <= par ? 3 : moves <= par * 1.5 ? 2 : 1; }
const Save = {
  data: null, loaded: false,
  parse(raw) {
    let o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    const level = Number.isInteger(o.level) && o.level >= 1 ? Math.min(o.level, 99999) : 1;
    const best = {}, stars = {};
    if (o.best && typeof o.best === 'object' && !Array.isArray(o.best)) for (const k in o.best) { const v = o.best[k]; if (KEY_RE.test(k) && Number.isInteger(v) && v > 0) best[k] = v; }
    if (o.stars && typeof o.stars === 'object' && !Array.isArray(o.stars)) for (const k in o.stars) { const v = o.stars[k]; if (KEY_RE.test(k) && (v === 1 || v === 2 || v === 3)) stars[k] = v; }
    const sfx = !(o.settings && o.settings.sfx === false);
    const bgm = !(o.settings && o.settings.bgm === false);
    const allClear = o.allClear === true || level > FINAL_LEVEL;
    return { v: SAVE_VER, level, best, stars, settings: { sfx, bgm }, allClear };
  },
  // best があって stars が無い面を、ベスト手数と目安から埋める（盤面生成は面番号だけで決まる。多すぎるセーブでも 300 面で打ち切る）
  fillStars(d) { let n = 0; for (const k in d.best) { if (d.stars[k]) continue; if (++n > 300) break; d.stars[k] = starsFor(d.best[k], generateLevel(Number(k)).par); } return d; },
  starTotals() { const s = (this.data && this.data.stars) || {}; let total = 0, n = 0; for (const k in s) { total += s[k]; n++; } return { total, max: n * 3 }; },
  async load() { this.data = Save.fillStars(Save.parse(await Platform.loadData())); this.loaded = true; },
  get(key, def) { return (this.data && key in this.data) ? this.data[key] : def; },
  set(key, val) { if (!this.data) return; this.data[key] = val; this.flush(); },
  flush() { if (this.loaded) Platform.saveData(JSON.stringify(this.data)); },
};
Save.data = Save.parse('');

// ---------- I18n（日英。言語は Platform.getLanguage() だけで決める。ja で始まれば日本語、それ以外は英語） ----------
const STR = {
  ja: { title1: 'しきぶちゃんの', title2: '在庫仕分け', start: 'タップでスタート', level: 'ステージ', moves: '手', clear: 'クリア!', next: 'つぎへ', best: 'ベスト', stuck: 'もう動かせない…', cont: 'つづきから',
        allClear: '全部そろえた!', allSub: '{n} ステージぜんぶクリア', endless: 'エンドレス', keep: 'つづける', movesPar: '手 {m}／目安 {p}', starsTotal: '星 {n}/{m}',
        undo: 'もどす', retry: 'やりなおす', sfx: '効果音', bgm: 'BGM' },
  en: { title1: "Shikibu's", title2: 'Stock Sort', start: 'Tap to start', level: 'Stage', moves: 'Moves', clear: 'CLEAR!', next: 'Next', best: 'Best', stuck: 'No moves left', cont: 'Continue',
        allClear: 'All sorted!', allSub: 'All {n} stages cleared', endless: 'Endless', keep: 'Keep going', movesPar: 'Moves {m} / Par {p}', starsTotal: 'Stars {n}/{m}',
        undo: 'Undo', retry: 'Restart', sfx: 'SFX', bgm: 'Music' },
};
let LANG = 'en';
function langOf(tag) { return String(tag || '').toLowerCase().startsWith('ja') ? 'ja' : 'en'; }
function T(k) { return (STR[LANG] || STR.en)[k] || STR.en[k] || k; }
// 面の表示名: 100 面までは「ステージ 12」、101 面からは「エンドレス 101」
function levelLabel(L) { return `${T(L > FINAL_LEVEL ? 'endless' : 'level')} ${L}`; }
// HUD の手数と目安: 「手 3／目安 12」
function movesLabel(m, p) { return T('movesPar').replace('{m}', m).replace('{p}', p); }

// ---------- 配色（アートディレクション v2） ----------
const PAL = {
  bgTop: '#4FD1FF', bgBot: '#7A5CFF', board: '#FFF6E0', boardEdge: '#FFFFFF', boardShadow: 'rgba(20,16,80,.35)',
  slot: '#FFE3A6', slotFrame: '#C97A3A', shelf: '#8B4E23', shelfTop: '#C08050', line: '#2B2620',
  doneSlot: '#D9F7E0', doneFrame: '#2E9E5B', doneGlow: '#9EF0B8', ok: '#2E9E5B', bad: '#FF3B3B',
  navy: '#0B1B3D', blue: '#2F6FD6', blueTop: '#4E8BEC', orange: '#FF8A3D', orangeTop: '#FFB157', orangeDeep: '#C25A14',
  green: '#2E9E5B', greenTop: '#4FC978', greenDeep: '#1E6E3F', gold: '#FFD23F', yellowTop: '#FFE28A', yellowBot: '#F5A400',
  confetti: ['#FF5C8A', '#FFD23F', '#4FD1FF', '#7CF29A', '#FFFFFF'],
};
// 文字の型（テロップ規約 v2 の流用。strokes は外→内、幅は字高比・片側）
const ST = {
  hud: { fill: [PAL.blueTop, PAL.blue], strokes: [[PAL.navy, 0.125], ['#fff', 0.10]], shadow: { color: 'rgba(11,27,61,.82)', dx: 0.05, dy: 0.07, blur: 0.04 } },
  title: { fill: [PAL.yellowTop, PAL.yellowBot], strokes: [[PAL.navy, 0.12], ['#fff', 0.08]], shadow: { color: 'rgba(11,27,61,.82)', dx: 0.05, dy: 0.07, blur: 0.04 } },
  btn: { fill: '#fff', strokes: [[PAL.navy, 0.08]] },
  plain: { fill: PAL.navy, strokes: [] },
  sub: { fill: '#fff', strokes: [[PAL.navy, 0.10]], shadow: { color: 'rgba(11,27,61,.6)', dx: 0.04, dy: 0.06, blur: 0.04 } },
  gold: { fill: [PAL.yellowTop, PAL.yellowBot], strokes: [[PAL.navy, 0.12]], shadow: { color: 'rgba(11,27,61,.6)', dx: 0.04, dy: 0.06, blur: 0.04 } },
  // v5d: 丸ボタンの下の小さい文字（字幕の型: 青塗り・白フチ・外に濃紺の細線。小さいのでフチを太めに）
  btnLabel: { fill: PAL.blue, strokes: [[PAL.navy, 0.24], ['#fff', 0.17]] },
};

// ---------- 乱数（面番号から決まる。同じ面は毎回同じ盤面） ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 盤面生成（逆手順で解ける保証。v1 と同じ） ----------
const CAP = 4;
function levelParams(L) {
  let kinds, empty = 2, mult;
  if (L <= 2) { kinds = 2; empty = 1; mult = 1.5; }
  else if (L <= 4) { kinds = 3; mult = 1.5; }
  else if (L <= 7) { kinds = 4; mult = 2; }
  else if (L <= 10) { kinds = 5; mult = 2; }
  else if (L <= 15) { kinds = 5; mult = 3; }
  else if (L <= 25) { kinds = 6; mult = 3; }
  else if (L <= 40) { kinds = 7; mult = 3.5; }
  else { kinds = Math.min(9, 7 + Math.floor((L - 41) / 20)); mult = 4; }
  return { kinds, empty, cap: CAP, shuffle: Math.round(kinds * CAP * mult) };
}
function isMono(c) { return c.every(v => v === c[0]); }
function isDone(c, cap) { return c.length === cap && isMono(c); }
function isSolved(cols, cap) { return cols.every(c => c.length === 0 || isDone(c, cap)); }
function canPlace(cols, cap, from, to) {
  if (from === to) return false;
  const src = cols[from], dst = cols[to];
  if (!src.length || isDone(src, cap)) return false;
  if (dst.length >= cap) return false;
  return dst.length === 0 || dst[dst.length - 1] === src[src.length - 1];
}
function productiveMoves(cols, cap) {
  let n = 0;
  for (let f = 0; f < cols.length; f++) {
    const src = cols[f];
    if (!src.length || isDone(src, cap)) continue;
    for (let t = 0; t < cols.length; t++) {
      if (!canPlace(cols, cap, f, t)) continue;
      if (cols[t].length === 0 && isMono(src)) continue;
      n++;
    }
  }
  return n;
}
function generateLevel(L) {
  const p = levelParams(L);
  for (let attempt = 0; attempt < 60; attempt++) {
    const rng = mulberry32((L * 2654435761 + attempt * 97 + 12345) >>> 0);
    const cols = [];
    for (let k = 0; k < p.kinds; k++) cols.push(new Array(p.cap).fill(k));
    for (let e = 0; e < p.empty; e++) cols.push([]);
    for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
    const unmoves = [];
    let last = null;
    for (let i = 0; i < p.shuffle; i++) {
      const S = [];
      cols.forEach((c, ci) => { if (c.length > 0 && (c.length === 1 || c[c.length - 2] === c[c.length - 1])) S.push(ci); });
      if (!S.length) break;
      let done = false;
      for (let tries = 0; tries < 20 && !done; tries++) {
        const s = S[Math.floor(rng() * S.length)];
        const x = cols[s][cols[s].length - 1];
        const D = [];
        cols.forEach((c, ci) => {
          if (ci === s || c.length >= p.cap) return;
          if (c.length === p.cap - 1 && c.every(v => v === x)) return;
          if (last && last[1] === s && last[0] === ci) return;
          D.push(ci);
        });
        if (!D.length) continue;
        const d = D[Math.floor(rng() * D.length)];
        cols[s].pop(); cols[d].push(x); unmoves.push([s, d]); last = [s, d]; done = true;
      }
      if (!done) break;
    }
    if (isSolved(cols, p.cap)) continue;
    if (cols.some(c => isDone(c, p.cap))) continue;
    if (unmoves.length < Math.max(3, p.shuffle * 0.6)) continue;
    const solution = unmoves.slice().reverse().map(([s, d]) => [d, s]);
    return { cols, cap: p.cap, kinds: p.kinds, solution, par: solution.length };
  }
  const cols = []; for (let k = 0; k < p.kinds; k++) cols.push(new Array(p.cap).fill(k)); cols.push([]);
  cols[0].pop(); cols[cols.length - 1].push(0);
  return { cols, cap: p.cap, kinds: p.kinds, solution: [[cols.length - 1, 0]], par: 1 };
}

// ---------- 音（v5: 素材＋加工。assets/sfx.js のエンジン＋ assets/sfx_data.js の MP3） ----------
// enabled = YouTube 側の音声（isAudioEnabled）、userMuted = 効果音の設定（HUD の「効果音」ボタン。セーブの settings.sfx）、
// bgmOn = BGM の設定（HUD の「BGM」ボタン。セーブの settings.bgm）。
// v5b: 音ボタンと m キーを外した（本作は効果音しか無く、効果音の ON/OFF は実質「全体のミュート」に見えたため）。
// v6: BGM（assets/bgm.js ＋ assets/bgm_data.js）を入れたので、「効果音」「BGM」それぞれの ON/OFF を戻す（SFX_TOGGLE = true）。
//     全体のミュートボタンは置かない（公式: ゲーム内に全体のミュートを置かない（SHOULD NOT）・効果音と BGM それぞれの切替は置いてよい）。m キーは使わないまま。
// 一時停止中・YouTube ミュート中は AudioContext ごと止める（効果音も BGM も、鳴りかけの音も止まる。BGM は再開で続きから）。
// AudioContext は起動時に作って復号だけ先に済ませ、最初のタップ（unlock）で動かす。v6: タイトルを描いた後にも一度 resume を試す
// （自動再生が許される環境ならタイトルの曲が聞こえる。許されなければ最初のタップまで止まったまま）。
// 案は A（木・紙）で確定（v5b）。assets/sfx_data.js には A だけが入っている（B は docs/sfx_data_AB.js の聞き比べ用だけ）。
const SFX_TOGGLE = true;
// 取る・置く・揃う・失敗は列の位置で左右にパン。置くは列ごとに音程をわずかに変える（30 セント刻み）。
// 揃うは面の中で連続するほど +1 半音ずつ上がる（上限 +5。失敗か面の入れ替えで 0 に戻る）。失敗は小さく。
// v5e: 置くのコンボ placeCombo = 失敗なしで続けて置けた回数（tryPlace が数える。失敗・その置きで列が揃った直後・面の入れ替えで 0）。
//      置く音を +min(n-1, 5) 半音、3 回目からコルクを -8dB で重ねる（assets/sfx.js の playPlace）。HUD には出さない。5 回目から光の粒 3 個
// v6 の BGM: タイトル = title・遊んでいる間（クリア画面も）= main（ステージが替わっても続けて流す）・全クリア = jingle を main に重ねる（main は -6dB）。
//      タイトル → 本編は 400ms のクロスフェード。ただし最初のタップまで AudioContext が止まっていた（タイトルの曲が聞こえていない）ときは、すぐ本編に替える
const Sound = {
  ctx: null, enabled: true, userMuted: false, bgmOn: true, tones: 0, combo: 0, placeCombo: 0, loaded: false, loading: null, bgmLoaded: false, bgmLoading: null,
  setup() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; return; }
    SFX.init(this.ctx);
    SFX.setBank('A');
    BGM.init(this.ctx);   // 設定（bgmOn）を読むまでは out = 0
    this.loading = SFX.load(typeof SFX_DATA !== 'undefined' ? SFX_DATA : null).then(() => { this.loaded = true; }).catch(() => {});
    // BGM の MP3（2.5MB）は defer で読むので、読み終わり（DOMContentLoaded）と効果音の復号を待ってから復号する（最初の 1 枚と効果音を先に）
    const parsed = new Promise(res => { if (document.readyState !== 'loading') res(); else document.addEventListener('DOMContentLoaded', res, { once: true }); });
    this.bgmLoading = Promise.all([this.loading, parsed]).then(() => BGM.load(typeof BGM_DATA !== 'undefined' ? BGM_DATA : null)).then(() => { this.bgmLoaded = true; }).catch(() => {});
  },
  // 曲を替える（同じ曲なら何もしない）。復号前なら「鳴らしたい曲」だけ覚えて、復号が済んだら鳴る
  // タイトルの曲が実際に聞こえていた（AudioContext の時計が進んでいた）時だけクロスフェードする。

  forceWorry: n => { G.worryHold = n; updateMood(); }, setMoves: n => { G.moves = n; updateMood(true); },
  sweatCount: () => G.sweat.length,
  sweatBurst: (n, sizes, ids, flow, hold) => { G.sweat = []; const end = spawnSweat(n, sizes, ids, flow); G.sweatNext = now() + (hold || 0); return end; },  // スクリーンショット用（流れをゆっくりに）
  faceRect: key => poseMeta(key || POSE.cur).face.slice(), sweatPoints: () => Object.keys(SWEAT_PTS), sweatSizes: () => Object.keys(SWEAT_SIZE),
  sweatGeom: (key, id, k, size) => sweatGeom(poseMeta(key || POSE.cur), id, k, size),
  sweatRects: () => { const L = G.layout || (G.layout = computeLayout()), f = characterFrame(L), p = poseMeta(POSE.cur), t = now(); return G.sweat.filter(q => t >= q.t0).map(q => { const e = t - q.t0; const k = e < SWEAT_APPEAR ? 0 : e < SWEAT_APPEAR + q.flow ? Math.pow((e - SWEAT_APPEAR) / q.flow, 2) : 1; const g = sweatGeom(p, q.id, k, q.size); return { id: q.id, size: q.size, x: f.gx + (g.x - p.ax) * f.s, y: f.gy + (g.y - p.ay) * f.s, w: g.w * f.s, h: g.h * f.s }; }); },
  faceRectScreen: () => { const L = G.layout || (G.layout = computeLayout()), f = characterFrame(L), p = poseMeta(POSE.cur), F = p.face; return { x: f.gx + (F[0] - p.ax) * f.s, y: f.gy + (F[1] - p.ay) * f.s, w: (F[2] - F[0]) * f.s, h: (F[3] - F[1]) * f.s }; },
  pose: () => POSE.cur, poseLog: () => POSE.log.slice(), poseRect: key => poseRect(G.layout || (G.layout = computeLayout()), key), poseKeys: () => Object.keys(PD.poses), envelope: () => ENV,
  setCols: cols => { G.cols = cols.map(c => c.slice()); G.held = null; G.layout = null; updateMood(); }, idleFor: ms => { POSE.lastInput = now() - ms; POSE.longIdle.next = 0; POSE.longIdle.until = 0; }, fidgetNow: () => { POSE.fidget.next = now() - 1; POSE.fidget.until = 0; },
  start: () => { if (G.scene === 'title') startLevel(Save.get('level', 1)); }, next: () => nextLevel(), goto: L => startLevel(L),
  generate: L => generateLevel(L), productiveMoves: () => productiveMoves(G.cols, G.cap),
  save: () => JSON.parse(JSON.stringify(Save.data)), lang: () => LANG, skin: () => G.skin.slice(),
  // v4: Playables 統合の確認用
  platform: () => ({ env: Platform.env, calls: Platform.calls.slice() }), parseSave: raw => Save.parse(raw),
  paused: () => G.paused, ready: () => G.ready, frames: () => G.frames, clock: () => now(),
  sound: () => ({ enabled: Sound.enabled, userMuted: Sound.userMuted, tones: Sound.tones, ctx: Sound.ctx ? Sound.ctx.state : null,
    loaded: Sound.loaded, decoded: SFX.decoded, failed: SFX.failed, bank: SFX.bank, combo: Sound.combo, placeCombo: Sound.placeCombo, last: SFX.last }),
  comboRule: () => Object.assign({}, SFX.COMBO), comboSparks: () => G.comboSparkN,   // v5e
  playSound: (name, ci) => Sound.play(name, ci), toggleSfx: () => toggleSfx(),
  // v6: BGM の状態・復号の完了待ち・切替
  bgm: () => Object.assign(BGM.state(), { bgmOn: Sound.bgmOn, loaded: Sound.bgmLoaded, ctx: Sound.ctx ? Sound.ctx.state : null }),
  bgmReady: () => Promise.resolve(Sound.bgmLoading), toggleBgm: () => toggleBgm(), unlockAudio: () => Sound.unlock(),
  // v5b: 全クリア・エンドレス・音ボタンの無効化の確認用
  allClear: () => ({ show: !!G.allClearShow, saved: !!Save.data.allClear, final: FINAL_LEVEL }), levelLabel: L => levelLabel(L), sfxToggle: () => SFX_TOGGLE,
  sfxBanks: () => (typeof SFX_DATA !== 'undefined' && SFX_DATA.sets) ? Object.keys(SFX_DATA.sets) : [],
  // v5c: 星の評価・目安の表示・HUD の段の確認用
  btnActive: k => btnActive(k),   // v5d
  starsFor: (m, p) => starsFor(m, p), clearStars: () => G.clearStars, starTotals: () => Save.starTotals(), hud: () => (G.layout || (G.layout = computeLayout())).hud,
  fillStars: raw => Save.fillStars(Save.parse(raw)),
  // v5: 音の確認用（パン・列ごとの音程・案の切り替え・復号の完了待ち）
  panFor: ci => Sound.panFor(ci), colCents: ci => Sound.colCents(ci), sfxBank: b => SFX.setBank(b), soundReady: () => Promise.resolve(Sound.loading),
  textBoxes: () => { TEXT_LOG = []; try { render(); } finally { const r = TEXT_LOG; TEXT_LOG = null; return r; } },
  strings: () => JSON.parse(JSON.stringify(STR)),
  effects: () => ({ anims: G.anims.length, effects: G.effects.length, particles: G.particles.length }),
  fontLoaded: () => document.fonts.check('900 20px UIRound'),
  missingAssets: () => Object.keys(IMG).filter(n => !ready(IMG[n])),
  fps: ms => new Promise(res => { let n = 0; const t0 = performance.now(); (function f() { n++; if (performance.now() - t0 < ms) requestAnimationFrame(f); else res(Math.round(n * 1000 / (performance.now() - t0))); })(); }),
};

// ---------- 起動 ----------
// 順序: 一時停止・音声の購読 → 背景だけの 1 枚を描いて firstFrameReady → 言語・セーブ（loadData）・画像・書体 → タイトルを描いて gameReady
(async function boot() {
  Platform.onPause(pauseGame);
  Platform.onResume(resumeGame);
  Sound.enabled = Platform.isAudioEnabled();
  Platform.onAudioEnabledChange(v => { Sound.enabled = v; Sound.sync(); });
  Sound.setup();   // 復号だけ先に（自動再生の制限で音は最初のタップまで出ない）
  Sound.music('title');   // v6: 復号が済んだらタイトルの曲（設定を読むまで BGM の出口は 0）
  resize();
  drawBackground({ W: view.w, H: view.h });
  Platform.firstFrameReady();
  LANG = langOf(await Platform.getLanguage());
  document.documentElement.lang = LANG;
  await Save.load();
  Sound.userMuted = SFX_TOGGLE && !Save.data.settings.sfx;   // 音ボタンが無い間はセーブの OFF を使わない（戻す手段が無いため）
  Sound.setBgm(!SFX_TOGGLE || Save.data.settings.bgm, true);   // v6: BGM の設定（フェードなしで反映）
  await Promise.all([loadImages(), document.fonts.load('900 20px UIRound').catch(() => {})]);
  G.titleT0 = now();
  G.ready = true;
  schedule();
  Sound.sync();   // v6: 自動再生が許される環境なら、ここでタイトルの曲が鳴り始める（許されなければ最初のタップまで止まったまま）
})();
</script>
