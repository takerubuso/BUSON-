<script>
'use strict';
/* =====================================================================
   しきぶちゃんのおつかいダッシュ（仮）— v1
   仕様は docs/仕様書_v1.md、見た目は docs/アートディレクション_v1.md。
   素の HTML/JS/Canvas。外部通信なし（SDK だけは YouTube が配る）。ブラウザ保存・ページ可視性・ブラウザの言語設定は使わない（tools/build_dist.py が検査）。
   SDK のスタブ・Platform・Save の作法・文字の表・切替ボタン・一時停止・ループ・テスト用の窓口の形は第3弾（ref/tidy-game/index.html）から移植。
   走る画面はドットの世界（1 マス = 16 ドット）で動かし、画面へは整数倍で拡大して描く。
   ===================================================================== */

// ---------- SDK のスタブ（YouTube の外で使う。本物の ytgame と同じ形・同じ戻り値の型。第3弾から移植） ----------
// window.__ytStubInit = { data, lang, audio } で初期状態を渡せる（テスト用）。言語は ?lang= でも変えられる。
function makeStubSdk(init) {
  init = init || {};
  const subs = { pause: [], resume: [], audio: [] };
  const on = (list, cb) => { list.push(cb); return () => { const i = list.indexOf(cb); if (i >= 0) list.splice(i, 1); }; };
  const emit = (list, v) => list.slice().forEach(f => { try { f(v); } catch (e) { /* 呼び出し先の例外で止めない */ } });
  const st = { data: typeof init.data === 'string' ? init.data : '', audio: init.audio !== false, lang: init.lang || new URLSearchParams(location.search).get('lang') || 'ja', score: null };
  const fail = type => { const e = new Error(type); e.errorType = type; return Promise.reject(e); };
  const sdk = {
    IN_PLAYABLES_ENV: false, SDK_VERSION: 'stub',
    game: {
      firstFrameReady() {}, gameReady() {},
      loadData() { return Promise.resolve(st.data); },
      saveData(s) { if (typeof s !== 'string') return fail('INVALID_PARAMS'); if (s.length * 2 > 3 * 1024 * 1024) return fail('SIZE_LIMIT_EXCEEDED'); st.data = s; return Promise.resolve(); },
    },
    system: {
      getLanguage() { return Promise.resolve(st.lang); },
      isAudioEnabled() { return st.audio; },
      onAudioEnabledChange(cb) { return on(subs.audio, cb); },
      onPause(cb) { return on(subs.pause, cb); },
      onResume(cb) { return on(subs.resume, cb); },
    },
    engagement: {
      sendScore(o) { if (!o || !Number.isFinite(o.value)) return fail('INVALID_PARAMS'); st.score = Math.max(st.score || 0, o.value); return Promise.resolve(); },
      openYTContent() { return Promise.resolve(); },
    },
    health: { logError() {}, logWarning() {} },
  };
  sdk.__stub = { state: st, pause: () => emit(subs.pause), resume: () => emit(subs.resume), setAudio: v => { st.audio = !!v; emit(subs.audio, st.audio); } };
  return sdk;
}

// ---------- Platform: ゲームから SDK を呼ぶ唯一の窓口（第3弾から移植） ----------
const Platform = (() => {
  const real = (typeof ytgame !== 'undefined' && ytgame && ytgame.game && ytgame.IN_PLAYABLES_ENV !== false) ? ytgame : null;
  const sdk = real || makeStubSdk(window.__ytStubInit);
  const calls = [];
  const call = (name, f, def) => { calls.push(name); try { return f(); } catch (e) { return def; } };
  const P = {
    env: real ? 'youtube' : 'stub', sdk, calls,
    firstFrameReady() { call('firstFrameReady', () => sdk.game.firstFrameReady()); },
    gameReady() { call('gameReady', () => sdk.game.gameReady()); },
    async getLanguage() { try { return String((await call('getLanguage', () => sdk.system.getLanguage(), '')) || ''); } catch (e) { return ''; } },
    async loadData() { try { const s = await call('loadData', () => sdk.game.loadData(), ''); return typeof s === 'string' ? s : ''; } catch (e) { P.logWarning(); return ''; } },
    saveData(str) { return Promise.resolve(call('saveData', () => sdk.game.saveData(str))).catch(() => P.logWarning()); },
    isAudioEnabled() { return call('isAudioEnabled', () => sdk.system.isAudioEnabled() !== false, true); },
    onAudioEnabledChange(cb) { call('onAudioEnabledChange', () => sdk.system.onAudioEnabledChange(v => cb(!!v))); },
    onPause(cb) { call('onPause', () => sdk.system.onPause(cb)); },
    onResume(cb) { call('onResume', () => sdk.system.onResume(cb)); },
    sendScore(n) { Promise.resolve(call('sendScore', () => sdk.engagement.sendScore({ value: n | 0 }))).catch(() => {}); },
    logError() { call('logError', () => sdk.health.logError()); },
    logWarning() { call('logWarning', () => sdk.health.logWarning()); },
  };
  return P;
})();
window.addEventListener('error', () => Platform.logError());

// ---------- 文字（日英。言語は Platform.getLanguage() だけで決める。ja で始まれば日本語、それ以外は英語） ----------
// tools/build_font.py がこの STR と NAMES から書体に入れる字を拾う。字を足したら流し直す。
const STR = {
  ja: { title1: 'しきぶちゃんの', title2: 'おつかいダッシュ', sub: "Shikibu's Errand Dash", start: 'タップでスタート', cont: 'つづきから {s}',
        howto: 'タップでジャンプ・長押しで高く', pause: '一時停止', paused: 'ひとやすみ', resume: 'つづける', map: '地図', next: 'つぎへ', clear: 'CLEAR!',
        sfx: '効果音', bgm: 'BGM', endless: 'どこまでダッシュ', dist: '{n} m', best: 'ベスト {n} m', newBest: 'ベスト更新！', runOver: 'ここまで！',
        allClear: 'おつかい完了！', allClearSub: '20 ステージぜんぶクリア', endlessOpen: '「どこまでダッシュ」が遊べるようになりました',
        combo: '{n} れんぞく', again: 'もういちど', mapTitle: '町の地図', welcome: 'おかえり！', memo: 'おつかいメモ', coins: '10円玉', lock: 'まだ' },
  en: { title1: "Shikibu's", title2: 'Errand Dash', sub: 'しきぶちゃんのおつかいダッシュ', start: 'Tap to start', cont: 'Continue: {s}',
        howto: 'Tap to jump, hold to jump higher', pause: 'Pause', paused: 'Paused', resume: 'Resume', map: 'Map', next: 'Next', clear: 'CLEAR!',
        sfx: 'SFX', bgm: 'Music', endless: 'Endless Dash', dist: '{n} m', best: 'Best {n} m', newBest: 'New best!', runOver: 'Run over!',
        allClear: 'Errand complete!', allClearSub: 'All 20 stages cleared', endlessOpen: 'Endless Dash is now open',
        combo: '{n} in a row', again: 'Try again', mapTitle: 'Town map', welcome: 'Welcome home!', memo: 'Errand notes', coins: 'Coins', lock: 'Locked' },
};
// 町（4 つ。仕様書第7節）と、敵・仕掛けの名前（一覧画像 enemies_all.png で使う）
const NAMES = {
  ja: { towns: ['商店街', '公園', '住宅街', '夕方の坂道'],
        enemies: ['目覚まし時計', '靴下', '空き缶', 'レジ袋', '洗濯ばさみ', '丸めたチラシ', '画びょう', '三角コーン', '水たまり'] },
  en: { towns: ['Shopping Street', 'Park', 'Neighborhood', 'Sunset Hill'],
        enemies: ['Alarm clock', 'Sock', 'Empty can', 'Plastic bag', 'Clothespin', 'Crumpled flyer', 'Thumbtacks', 'Traffic cone', 'Puddle'] },
};
let LANG = 'en';
function langOf(tag) { return String(tag || '').toLowerCase().startsWith('ja') ? 'ja' : 'en'; }
function T(k, vars) { let s = (STR[LANG] || STR.en)[k]; if (s == null) s = STR.en[k] != null ? STR.en[k] : k; if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; }
function townName(t) { return (NAMES[LANG] || NAMES.en).towns[t]; }

// ---------- 小さな道具 ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// 第1弾と同じ mulberry32。ステージの部品の並びはステージ番号から決まる（誰が遊んでも同じ道）
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = Math.random;   // 演出の揺れだけに使う。テストは Game.seed(n) で固定できる
// ゲームの時計（一時停止中は止まる。第3弾と同じ）
const CLOCK = { off: 0, at: 0, stopped: false, skew: 0 };
const now = () => (CLOCK.stopped ? CLOCK.at : performance.now()) - CLOCK.off + CLOCK.skew;
const FX = { t: 0, last: 0 };
const fxNow = () => FX.t;
function hexRgb(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; }

// ---------- ステージの番号 ----------
const TOWNS = 4, PER_TOWN = 5, LAST = TOWNS * PER_TOWN;      // 20 ステージ（1-1〜4-5）
const stageId = n => Math.floor((n - 1) / PER_TOWN) + 1 + '-' + ((n - 1) % PER_TOWN + 1);   // n = 1〜20
const townOf = n => Math.floor((n - 1) / PER_TOWN);
const ENDLESS = 99;   // どこまでダッシュ

// ---------- セーブ（saveData/loadData に JSON 文字列 1 つ。第3弾の Save の作法を移植して中身をこのゲーム用に） ----------
// 形式 v1: { v, cleared{ "1-1": { stars, memos[3], coins } }, total_coins, best_distance, settings{ sfx, bgm }, stats{}, allClear }
// 壊れた・型違いのセーブは項目ごとに既定値へ落とす（落ちない）。loadData が済むまで saveData は呼ばない。20 ステージ分でも 2KB 程度。
const SAVE_VER = 1;
const int = (v, lo, hi, def) => Number.isInteger(v) && v >= lo && v <= hi ? v : def;
function freshStats() { return { plays: 0, clears: 0, falls: 0, hits: 0, stomps: 0, jumps: 0, playMs: 0, runs: 0 }; }
const Save = {
  data: null, loaded: false, timer: 0, writes: 0, lastLen: 0,
  parse(raw) {
    let o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    const cl = (o.cleared && typeof o.cleared === 'object' && !Array.isArray(o.cleared)) ? o.cleared : {};
    const cleared = {};
    for (let n = 1; n <= LAST; n++) {
      const c = cl[stageId(n)];
      if (!c || typeof c !== 'object') continue;
      const memos = [0, 1, 2].map(i => Array.isArray(c.memos) && (c.memos[i] === 1 || c.memos[i] === true) ? 1 : 0);
      cleared[stageId(n)] = { stars: int(c.stars, 1, 3, 1), memos, coins: int(c.coins, 0, 9999, 0) };
    }
    const s = (o.stats && typeof o.stats === 'object' && !Array.isArray(o.stats)) ? o.stats : {};
    const stats = freshStats();
    for (const k in stats) if (Number.isFinite(s[k]) && s[k] >= 0) stats[k] = s[k];
    return {
      v: SAVE_VER, cleared, stats, total_coins: int(o.total_coins, 0, 1e9, 0), best_distance: int(o.best_distance, 0, 1e9, 0),
      allClear: o.allClear === true && !!cleared[stageId(LAST)],
      fresh: !raw || !Object.keys(o).length,
      settings: { sfx: !(o.settings && o.settings.sfx === false), bgm: !(o.settings && o.settings.bgm === false) },
    };
  },
  build() {
    return { v: SAVE_VER, cleared: G.cleared, total_coins: G.totalCoins, best_distance: G.bestDist, settings: { sfx: !Sound.userMuted, bgm: Sound.bgmOn }, stats: G.stats, allClear: G.allClear };
  },
  async load() { this.data = Save.parse(await Platform.loadData()); this.loaded = true; return this.data; },
  flush() {
    if (!this.loaded) return;
    const s = JSON.stringify(this.build()); this.lastLen = s.length; this.writes++;
    Platform.saveData(s);
  },
};
function applySave(d) { G.cleared = d.cleared; G.totalCoins = d.total_coins; G.bestDist = d.best_distance; G.stats = d.stats; G.allClear = d.allClear; }

// ---------- 音（ファミコン風の合成音。四角い波・三角の波・雑音を Web Audio で作る。音源ファイルなし。仕様書第11節） ----------
// enabled = YouTube 側の音声（isAudioEnabled）。一時停止中・YouTube ミュート中は AudioContext ごと止める（第3弾と同じ）。
// userMuted = 効果音の設定（ボタン。セーブの settings.sfx）。bgmOn は v2 の BGM 用に設定だけ持つ（BGM が無い間はボタンを隠す）。
const HAS_BGM = false;
const Sound = {
  ctx: null, enabled: true, userMuted: false, bgmOn: true, tones: 0, last: null, out: null, noise: null, coinStreak: 0, coinAt: -1e9,
  setup() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.out = c.createGain(); this.out.gain.value = 0.5; this.out.connect(c.destination);
    const len = Math.floor(c.sampleRate * 0.5), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let x = 0x1234; for (let i = 0; i < len; i++) { x ^= x << 7; x ^= x >> 9; x &= 0xFFFF; d[i] = (x & 1) ? 0.8 : -0.8; }   // ファミコンの雑音のような 1 ビットの雑音
    this.noise = buf;
  },
  unlock() { this.setup(); this.sync(); },
  sync() { const c = this.ctx; if (!c) return; if (G.paused || !this.enabled) { if (c.state === 'running') c.suspend().catch(() => {}); } else if (c.state === 'suspended') c.resume().catch(() => {}); },
  on() { return this.enabled && !this.userMuted && !G.paused && this.ctx; },
  setBgm(on) { this.bgmOn = !!on; return this.bgmOn; },
  // 1 音: type = square / triangle / noise。f0 → f1 へ滑らせる
  tone(type, f0, f1, dur, gain, delay) {
    const c = this.ctx, t0 = c.currentTime + (delay || 0), g = c.createGain();
    g.gain.setValueAtTime(gain, t0); g.gain.setValueAtTime(gain, t0 + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    let src;
    if (type === 'noise') { src = c.createBufferSource(); src.buffer = this.noise; src.loop = true; src.playbackRate.setValueAtTime(f0, t0); if (f1 !== f0) src.playbackRate.linearRampToValueAtTime(f1, t0 + dur); }
    else { src = c.createOscillator(); src.type = type; src.frequency.setValueAtTime(f0, t0); if (f1 !== f0) src.frequency.exponentialRampToValueAtTime(f1, t0 + dur); }
    src.connect(g); g.connect(this.out); src.start(t0); src.stop(t0 + dur + 0.02);
  },
  notes(type, fs, step, gain, dur, delay) { fs.forEach((f, i) => { if (f) this.tone(type, f, f, dur || step * 0.9, gain, (delay || 0) + i * step); }); },
  play(role, arg) {
    if (!this.on()) return null;
    const S = this;
    switch (role) {
      case 'jump': S.tone('square', 330, 760, 0.14, 0.13); break;                                   // ピョン
      case 'land': S.tone('noise', 0.35, 0.2, 0.05, 0.12); break;                                    // トン
      case 'coin': {                                                                                 // チャリン（続けて取ると半音ずつ上がる。上限 8）
        const semis = Math.min(8, arg || 0), k = Math.pow(2, semis / 12);
        S.tone('square', 988 * k, 988 * k, 0.06, 0.1); S.tone('square', 1319 * k, 1319 * k, 0.22, 0.1, 0.06); break;
      }
      case 'stomp': { const k = Math.pow(2, Math.min(8, (arg || 1) - 1) * 2 / 12); S.tone('triangle', 700 * k, 180 * k, 0.12, 0.35); S.tone('noise', 1.2, 0.5, 0.05, 0.08); break; }   // ポコッ
      case 'memo': S.notes('square', [784, 988, 1175, 1568], 0.07, 0.09, 0.09); S.notes('triangle', [392, 494, 587, 784], 0.07, 0.25, 0.12); break;   // 短いファンファーレ
      case 'hit': S.tone('square', 440, 110, 0.35, 0.12); S.tone('noise', 0.6, 0.2, 0.2, 0.1); break;                // 失敗の音
      case 'fall': S.tone('square', 880, 140, 0.55, 0.1); break;
      case 'check': S.notes('square', [523, 659, 784, 1047], 0.06, 0.09, 0.08); break;               // 中間地点
      case 'goal': S.notes('square', [523, 523, 659, 784, 0, 659, 784, 1047], 0.1, 0.1, 0.12); S.notes('triangle', [262, 262, 330, 392, 0, 330, 392, 523], 0.1, 0.25, 0.14); break;   // ジングル
      case 'door': S.tone('noise', 0.25, 0.15, 0.18, 0.1); S.tone('triangle', 220, 330, 0.15, 0.25); break;
      case 'star': { const f = [880, 1109, 1319][clamp((arg || 1) - 1, 0, 2)]; S.tone('square', f, f, 0.12, 0.1); S.tone('square', f * 1.5, f * 1.5, 0.16, 0.08, 0.08); break; }
      case 'tap': S.tone('square', 660, 660, 0.04, 0.08); break;
      case 'start': S.notes('square', [392, 523, 659, 784], 0.05, 0.1, 0.06); break;
      case 'over': S.notes('square', [659, 523, 440, 330], 0.12, 0.1, 0.14); break;
      default: return null;
    }
    this.tones++; this.last = role; return role;
  },
};

  b: '#2A2733', B: '#4A4658', w: '#FFFFFF', W: '#C4C6D2', y: '#FFFFFF', R: '#E4574B', D: '#9E3A34', g: '#F2C14E', G: '#B8872A', f: '#FFF3DC',

  x: '#D9D0BE', O: '#F28C28', Z: '#6A4A3A', C: '#D0823F', Q: '#8E4E22', T: '#F4B880', l: '#7E97C4',

// ---- しきぶ（16×24。アートディレクション第2節: 長い真っ黒な髪・真ん中分け・頭のてっぺんの左右の出っぱり・肌色の丸い顔・赤い口・眠そうな横長の目・ピンクの長袖・黒いズボン・白い靴）
const HEAD = {
  n: ['....kk....kk....', '...kkkkkkkkkk...', '..kkkkkkkkkkkk..', '.kkkkkkKkkkkkkk.', '.kkkkkksskkkkkk.', 'kkkkksssssskkkkk',
      'kkkkssssssssKkkk', 'kkkseesssseeskkk', 'kkkssssssssssskk', 'kkkssssrrsssskkk', 'kkkkSssssssSkkkk'],
  // 跳ぶ・落ちる: 髪がふわっと上がって広がる
  j: ['...kk......kk...', '..kkkkkkkkkkkk..', '.kkkkkkkkkkkkkk.', 'kkkkkkkKkkkkkkkk', 'kkkkkkksskkkkkkk', 'kkkkksssssskkkkk',
      'kkkkssssssssKkkk', 'kkkseesssseeskkk', 'kkkssssssssssskk', 'kkkssssrrsssskkk', 'kkkkSssssssSkkkk'],
  // 転ぶ: >< の目・口をあける
  t: ['....kk....kk....', '...kkkkkkkkkk...', '..kkkkkkkkkkkk..', '.kkkkkkKkkkkkkk.', '.kkkkkksskkkkkk.', 'kkkkksssssskkkkk',
      'kkkkeSsssssekkkk', 'kkkssesssseskkkk', 'kkkkeSsssssekkkk', 'kkkssssrrsssskkk', 'kkkkSssrrssSkkkk'],
  // 弾む・喜ぶ: 口を大きく
  y: ['....kk....kk....', '...kkkkkkkkkk...', '..kkkkkkkkkkkk..', '.kkkkkkKkkkkkkk.', '.kkkkkksskkkkkk.', 'kkkkksssssskkkkk',
      'kkkkssssssssKkkk', 'kkkseesssseeskkk', 'kkkssssssssssskk', 'kkksssrrrrssskkk', 'kkkkSssrrssSkkkk'],
};
const BODY = {

// 表 → 1 倍のキャンバス（色の差し替え map を渡せる）
const SPRITES = new Map();
function makeSprite(rows, pal) {
  const w = rows[0].length, h = rows.length, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'), img = c.createImageData(w, h), d = img.data;
  rows.forEach((r, y) => {
    if (r.length !== w) console.error('sprite row width', y, r);
    for (let x = 0; x < w; x++) { const ch = r[x], col = pal && pal[ch] || PX[ch]; if (ch === '.' || !col) continue; const [R, Gg, B] = hexRgb(col), i = (y * w + x) * 4; d[i] = R; d[i + 1] = Gg; d[i + 2] = B; d[i + 3] = 255; }
  });
  c.putImageData(img, 0, 0); return cv;
}
function spr(name) {
  let cv = SPRITES.get(name); if (cv) return cv;
  if (SHIKIBU_FRAMES[name]) { const [h, b] = SHIKIBU_FRAMES[name]; cv = makeSprite(HEAD[h].concat(BODY[b])); }
  else if (name.endsWith('_sq')) cv = makeSprite(squash(ART[name.slice(0, -3)]), artPal(name));
  else cv = makeSprite(ART[name], artPal(name));
  SPRITES.set(name, cv); return cv;
}
// ぺちゃんこ: 絵のある行を 1 行おきに間引いて下に寄せ、目を「ー」に（1 コマ）
function squash(rows) {
  const used = rows.filter(r => /[^.]/.test(r)), keep = used.filter((r, i) => i % 3 !== 1);
  const out = keep.slice(Math.max(0, keep.length - 7)).map(r => r.replace(/ye/g, 'ee').replace(/y/g, 'e'));
  while (out.length < rows.length) out.unshift('.'.repeat(rows[0].length));
  return out;
}

  // 一覧画像（tools/sprite_sheets.py）: 絵を 1 倍と 4 倍で並べたキャンバスの dataURL
  sheet: kind => {
    const names = kind === 'shikibu' ? Object.keys(SHIKIBU_FRAMES) : ['clock0', 'clock1', 'clock0_sq', 'sock0', 'sock1', 'sock0_sq', 'can0', 'can1', 'can0_sq', 'bag0', 'bag1', 'bag0_sq', 'pin0', 'pin1', 'pinOpen', 'pin0_sq', 'flyer0', 'flyer1', 'flyer0_sq', 'tacks', 'cone', 'coin0', 'coin1', 'coin2', 'memo'];
    const K = 4, cell = 24 * K + 16, perRow = kind === 'shikibu' ? 9 : 7, rows = Math.ceil(names.length / perRow);
    const [cv, c] = cv1(perRow * cell + 16, rows * (cell + 70) + 60); c.imageSmoothingEnabled = false;
    c.fillStyle = '#FFF8EE'; c.fillRect(0, 0, cv.width, cv.height);
    c.fillStyle = '#4A2A22'; c.font = font(16); c.fillText(kind === 'shikibu' ? 'しきぶ 9 コマ（1 倍・4 倍）' : 'ちらかりオバケ・仕掛け・10円玉・メモ（1 倍・4 倍。_sq = 踏まれてぺちゃんこ）', 12, 26);
    names.forEach((nm, i) => {
      const im = spr(nm), x = 12 + (i % perRow) * cell, y = 44 + Math.floor(i / perRow) * (cell + 70);
      c.fillStyle = i % 2 ? '#BFE3F2' : '#CDEBC8'; c.fillRect(x, y, cell - 8, cell + 30);
      c.drawImage(im, x + 4, y + 4); c.drawImage(im, x + 4 + 24, y + 4, im.width * K, im.height * K);
      c.fillStyle = '#4A2A22'; c.font = font(12);
      const ki = ENEMY_KINDS.indexOf(nm.replace(/\d|_sq|Open/g, '').replace('pin', 'pin')), label = ki >= 0 ? NAMES.ja.enemies[ki] : nm === 'tacks' ? NAMES.ja.enemies[6] : nm === 'cone' ? NAMES.ja.enemies[7] : '';
      c.fillText(nm, x + 4, y + cell + 12); if (label) c.fillText(label, x + 4, y + cell + 26);
    });
    return cv.toDataURL('image/png');
  },
};

// ---------- 起動 ----------
// 順序: 一時停止・音声の購読 → 空の色だけの 1 枚を描いて firstFrameReady → 言語・セーブ（loadData）・画像・書体 → タイトルを描いて gameReady
(async function boot() {
  Platform.onPause(pauseGame);
  Platform.onResume(resumeGame);
  Sound.enabled = Platform.isAudioEnabled();
  Platform.onAudioEnabledChange(v => { Sound.enabled = v; Sound.sync(); });
  resize();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = TOWN_PAL[0].sky[0]; ctx.fillRect(0, 0, canvas.width, canvas.height);
  Platform.firstFrameReady();
  LANG = langOf(await Platform.getLanguage());
  document.documentElement.lang = LANG;
  applySave(await Save.load());
  Sound.userMuted = !Save.data.settings.sfx;
  Sound.setBgm(Save.data.settings.bgm);
  await Promise.all([loadImages(), document.fonts.load('400 20px DashPop').catch(() => {})]);
  G.ready = true; FX.last = performance.now();
  schedule();
})();
</script>
