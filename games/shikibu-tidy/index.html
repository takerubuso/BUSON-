<script>
'use strict';
/* =====================================================================
   しきぶのおかたづけ（仮）— v1
   仕様は docs/仕様書_v1.md、見た目の値は docs/アートディレクション_v1.md（土台は第2弾 ref/cafe-game/docs/アートディレクション_v1.md）。
   素の HTML/JS/Canvas。外部通信なし（SDK だけは YouTube が配る）。ブラウザ保存・ページ可視性・ブラウザの言語設定は使わない（tools/build_dist.py が検査）。
   SDK のスタブ・Platform・Save の形・しきぶのポーズの状態機械・汗・ボタン・切替ボタン・物の描き方（Path2D の部品）・演出の粒・入力・一時停止・
   テスト用の窓口の形は第2弾（ref/cafe-game/index.html）から移植。
   ===================================================================== */

// ---------- SDK のスタブ（YouTube の外で使う。本物の ytgame と同じ形・同じ戻り値の型。第2弾から移植） ----------
// window.__ytStubInit = { data, lang, audio } で初期状態を渡せる（テスト用）。言語は ?lang= でも変えられる。
function makeStubSdk(init) {
  init = init || {};
  const subs = { pause: [], resume: [], audio: [] };
  const on = (list, cb) => { list.push(cb); return () => { const i = list.indexOf(cb); if (i >= 0) list.splice(i, 1); }; };
  const emit = (list, v) => list.slice().forEach(f => { try { f(v); } catch (e) { /* 呼び出し先の例外で止めない */ } });
  const st = { data: typeof init.data === 'string' ? init.data : '', audio: init.audio !== false, lang: init.lang || new URLSearchParams(location.search).get('lang') || 'ja', score: null };
  const fail = type => { const e = new Error(type); e.errorType = type; return Promise.reject(e); };
  const sdk = {
    IN_PLAYABLES_ENV: false, SDK_VERSION: 'stub',
    game: {
      firstFrameReady() {}, gameReady() {},
      loadData() { return Promise.resolve(st.data); },
      saveData(s) { if (typeof s !== 'string') return fail('INVALID_PARAMS'); if (s.length * 2 > 3 * 1024 * 1024) return fail('SIZE_LIMIT_EXCEEDED'); st.data = s; return Promise.resolve(); },
    },
    system: {
      getLanguage() { return Promise.resolve(st.lang); },
      isAudioEnabled() { return st.audio; },
      onAudioEnabledChange(cb) { return on(subs.audio, cb); },
      onPause(cb) { return on(subs.pause, cb); },
      onResume(cb) { return on(subs.resume, cb); },
    },
    engagement: {
      sendScore(o) { if (!o || !Number.isFinite(o.value)) return fail('INVALID_PARAMS'); st.score = Math.max(st.score || 0, o.value); return Promise.resolve(); },
      openYTContent() { return Promise.resolve(); },
    },
    health: { logError() {}, logWarning() {} },
  };
  sdk.__stub = { state: st, pause: () => emit(subs.pause), resume: () => emit(subs.resume), setAudio: v => { st.audio = !!v; emit(subs.audio, st.audio); } };
  return sdk;
}

// ---------- Platform: ゲームから SDK を呼ぶ唯一の窓口（第2弾から移植） ----------
const Platform = (() => {
  const real = (typeof ytgame !== 'undefined' && ytgame && ytgame.game && ytgame.IN_PLAYABLES_ENV !== false) ? ytgame : null;
  const sdk = real || makeStubSdk(window.__ytStubInit);
  const calls = [];
  const call = (name, f, def) => { calls.push(name); try { return f(); } catch (e) { return def; } };
  const P = {
    env: real ? 'youtube' : 'stub', sdk, calls,
    firstFrameReady() { call('firstFrameReady', () => sdk.game.firstFrameReady()); },
    gameReady() { call('gameReady', () => sdk.game.gameReady()); },
    async getLanguage() { try { return String((await call('getLanguage', () => sdk.system.getLanguage(), '')) || ''); } catch (e) { return ''; } },
    async loadData() { try { const s = await call('loadData', () => sdk.game.loadData(), ''); return typeof s === 'string' ? s : ''; } catch (e) { P.logWarning(); return ''; } },
    saveData(str) { return Promise.resolve(call('saveData', () => sdk.game.saveData(str))).catch(() => P.logWarning()); },
    isAudioEnabled() { return call('isAudioEnabled', () => sdk.system.isAudioEnabled() !== false, true); },
    onAudioEnabledChange(cb) { call('onAudioEnabledChange', () => sdk.system.onAudioEnabledChange(v => cb(!!v))); },
    onPause(cb) { call('onPause', () => sdk.system.onPause(cb)); },
    onResume(cb) { call('onResume', () => sdk.system.onResume(cb)); },
    sendScore(n) { Promise.resolve(call('sendScore', () => sdk.engagement.sendScore({ value: n | 0 }))).catch(() => {}); },
    logError() { call('logError', () => sdk.health.logError()); },
    logWarning() { call('logWarning', () => sdk.health.logWarning()); },
  };
  return P;
})();
window.addEventListener('error', () => Platform.logError());

// ---------- 文字（日英。言語は Platform.getLanguage() だけで決める。ja で始まれば日本語、それ以外は英語） ----------
// tools/build_font.py がこの STR と NAMES から書体に入れる字を拾う。字を足したら流し直す。
// ステージは「STAGE 5」と書く（アートディレクション第5節。Zen Maru Gothic Black の小さい漢字を避ける）
const STR = {
  ja: { title1: 'しきぶの', title2: 'おかたづけ', sub: "Shikibu's Tidy Match", start: 'タップでスタート', cont: 'つづきから STAGE {n}',
        stage: 'STAGE {n}', rooms: '部屋', close: '閉じる', next: 'つぎへ', cardTitle: 'STAGE {n} クリア', cleanUp: 'きれい度 +{n}%', cleanMax: 'ピカピカ！',
        full: 'トレイがいっぱい！', retry: 'もういっかい', contTool: '道具で続ける', t_undo: 'もどす', t_aside: 'よける', t_shuffle: 'まぜる',
        combo: '{n}コンボ', revealTitle: '{room}がピカピカ！', before: 'ビフォー', after: 'アフター', tapNext: 'タップでつぎへ',
        roomsTitle: 'お部屋アルバム', encore: 'おかわり', encoreStage: 'おかわり {n}', allClear: '全部屋ピカピカ！', allClearSub: '{n}ステージぜんぶクリア',
        allClearNote: 'このあとは おかわりステージ', done: '完成', pct: '{n}%', sfx: '効果音', bgm: 'BGM', thanks: 'おつかれさま', wow: 'ピカッ！' },
  en: { title1: "Shikibu's", title2: 'Tidy Match', sub: 'しきぶのおかたづけ', start: 'Tap to start', cont: 'Continue: STAGE {n}',
        stage: 'STAGE {n}', rooms: 'Rooms', close: 'Close', next: 'Next', cardTitle: 'STAGE {n} cleared', cleanUp: 'Tidiness +{n}%', cleanMax: 'Spotless!',
        full: 'The tray is full!', retry: 'Try again', contTool: 'Continue with a tool', t_undo: 'Undo', t_aside: 'Set aside', t_shuffle: 'Shuffle',
        combo: '{n} combo', revealTitle: '{room} is spotless!', before: 'Before', after: 'After', tapNext: 'Tap to continue',
        roomsTitle: 'Room album', encore: 'Encore', encoreStage: 'Encore {n}', allClear: 'Every room is spotless!', allClearSub: 'All {n} stages cleared',
        allClearNote: 'Encore stages continue from here', done: 'Done', pct: '{n}%', sfx: 'SFX', bgm: 'Music', thanks: 'Great job', wow: 'Sparkle!' },
};
// 部屋（5 つ）と物（30 種。部屋ごとに 6 種。仕様書第6節）
const NAMES = {
  ja: { rooms: ['リビング', '台所', '子ども部屋', 'お風呂・洗面所', '玄関'],
        items: ['リモコン', 'クッション', 'マグカップ', '雑誌', 'ぬいぐるみ', '目覚まし時計',
                'お皿', 'フライパン', 'たまご', 'にんじん', 'りんご', '牛乳パック',
                '積み木', '絵本', 'クレヨン', 'ボール', 'ロボット', 'ミニカー',
                'アヒル', '石けん', '歯ブラシ', 'タオル', 'シャンプー', 'コップ',
                '靴', '長靴', '傘', '帽子', 'かぎ', '封筒'] },
  en: { rooms: ['Living room', 'Kitchen', "Kids' room", 'Bathroom', 'Entryway'],
        items: ['Remote', 'Cushion', 'Mug', 'Magazine', 'Teddy bear', 'Alarm clock',
                'Plate', 'Frying pan', 'Eggs', 'Carrot', 'Apple', 'Milk carton',
                'Blocks', 'Picture book', 'Crayons', 'Ball', 'Toy robot', 'Toy car',
                'Rubber duck', 'Soap', 'Toothbrush', 'Towel', 'Shampoo', 'Cup',
                'Sneakers', 'Rain boots', 'Umbrella', 'Hat', 'Key', 'Letter'] },
};
let LANG = 'en';
function langOf(tag) { return String(tag || '').toLowerCase().startsWith('ja') ? 'ja' : 'en'; }
function T(k, vars) { let s = (STR[LANG] || STR.en)[k]; if (s == null) s = STR.en[k] != null ? STR.en[k] : k; if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; }
function roomName(r) { return (NAMES[LANG] || NAMES.en).rooms[r]; }
function itemName(k) { return (NAMES[LANG] || NAMES.en).items[k]; }

// ---------- 配色（アートディレクション第1節。ここ以外で色を決めない） ----------
// 共通は第2弾から引き継ぐ（インク・影・テラコッタ・セージ濃・バター・ベリー）。トレイは木の棚板。タイルはクリームに 4px の厚み
const PAL = {
  ink: '#3A2A22', shadow: 'rgba(92,52,30,.28)',
  terra: '#E8704A', terraTop: '#F59A6E', terraDeep: '#B8502F',
  ok: '#4F9A6E', okTop: '#6DB88A', okDeep: '#3A7653',
  butter: '#FFD166', butterEdge: '#E0A526', berry: '#FF7AA2',
  wood: '#C98B5A', woodTop: '#E3A977', woodShadow: '#A86E43',
  tile: '#FFF8EE', tileSide: '#E9D6BF', hollow: '#F3E4D0', board: '#FFF8EE',
  alarm: '#E5484D', note: '#FFF3C4', paper: '#FFFCF4', haze: '#9A9088',
};
// 部屋ごとの 4 色（片付いた状態。アートディレクション第1節の表）。散らかった状態は彩度 −35%・明度 −12% に灰色のもや
const ROOM_PAL = [
  { wall: '#FBEFE3', floor: '#D9A774', a1: '#A8CBB0', a2: '#E8704A' },   // リビング: クリーム・木・セージ・テラコッタ
  { wall: '#EEF6F0', floor: '#E7DCCB', a1: '#6FCFC2', a2: '#FFD166' },   // 台所: ミントの白・タイル・ミント・レモン
  { wall: '#E6F1FB', floor: '#E0B585', a1: '#FF8FB1', a2: '#7CC6FE' },   // 子ども部屋: 淡い空色・木・ベリー・空
  { wall: '#F2F6F8', floor: '#D6ECF3', a1: '#7CC6FE', a2: '#6FCFC2' },   // お風呂・洗面所: 白タイル・淡い水色・水色・ミント
  { wall: '#F6EEE2', floor: '#CFC6BA', a1: '#C98B5A', a2: '#A8CBB0' },   // 玄関: 生成り・石・木・セージ
];
const DIRTY = { sat: 0.65, light: 0.88, haze: 0.22 };
// 影は必ず真下（下 6px・ぼかし 14px）。全部品で同じ値を使う
const SHADOW = { color: PAL.shadow, dy: 6, blur: 14 };

// ---------- 遊びの数（仕様書第3・4・5節） ----------
const TRAY_N = 7, ASIDE_N = 3;
const FLY_MS = 200, SLIDE_MS = 120, SUCK_MS = 170, COMBO_MS = 3000, COMBO_MAX_SEMIS = 8, HINT_MS = 20000;
// 1 部屋のステージ数（本人判断 2026-09-24 で 10 → 15。部屋 1 のお披露目まで 10〜15 分に入れるため）。最後の部屋のお披露目で全部屋ピカピカ。その先はおかわり
const STAGES_PER_ROOM = 15, ROOMS = 5, LAST_ROOM_STAGE = STAGES_PER_ROOM * ROOMS;
// きれい度（%）: 片付けた数 c から。1 回あたりは 100 / STAGES_PER_ROOM を四捨五入した差（合計でちょうど 100%）
const cleanPct = c => Math.round(clamp(c, 0, STAGES_PER_ROOM) * 100 / STAGES_PER_ROOM);
const TOOLS = ['undo', 'aside', 'shuffle'];
const NITEMS = 30;
// 物の素材（タップの音を少し変える。0 かたい・1 やわらかい・2 紙・3 金属やガラス）
const MATERIAL = [0, 1, 0, 2, 1, 3,  3, 3, 0, 0, 0, 2,  0, 2, 2, 1, 3, 3,  1, 1, 0, 1, 0, 3,  1, 1, 2, 1, 3, 2];
const roomOfStage = n => n <= LAST_ROOM_STAGE ? Math.floor((n - 1) / STAGES_PER_ROOM) : (n - LAST_ROOM_STAGE - 1) % ROOMS;
const isEncore = n => n > LAST_ROOM_STAGE;

// ---------- 時計・乱数 ----------
// ゲームの時計。一時停止中は止まり、再開後は止まっていた時間を差し引く。skew はテスト用
const CLOCK = { off: 0, at: 0, stopped: false, skew: 0 };
const now = () => (CLOCK.stopped ? CLOCK.at : performance.now()) - CLOCK.off + CLOCK.skew;
// 演出の時計（山の最後の 1 つのスローモーションの間だけ遅く進む。入力と遊びの判定はふつうの時計で動く）
const FX = { t: 0, last: 0, slowUntil: 0 };
const fxNow = () => FX.t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
// 第1弾と同じ mulberry32。ステージの山はステージ番号から決まる（誰が遊んでも同じ山）
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = Math.random;   // 演出とヒントの揺れだけに使う（山には使わない）。テストは Game.seed(n) で固定できる

// ---------- ステージの作り方（仕様書第4節。自動生成・道具なしで解ける保証） ----------
// 山は「層」で作る。位置は半マス単位（1 つの物は 2×2 の半マスを占める）。z が大きいほど上。
// 物 A が物 B を覆う = A が B より上の層にあって、半マスの位置の差が縦横とも 2 未満（1 ミリでも重なる）。
// 形の型（レイアウト）: 横長・ピラミッド・ハート・家・Y 字・ひし形・ふたご・リング・十字。u, v は 0〜1 の位置
const SHAPES = {
  rect: () => true,
  wide: () => true,
  heart: (u, v) => { const x = (u - 0.5) * 2.5, y = (0.42 - v) * 2.5; return Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0.02; },
  house: (u, v) => v < 0.42 ? Math.abs(u - 0.5) <= v / 0.42 * 0.5 + 0.08 : (u > 0.08 && u < 0.92),
  Y: (u, v) => v < 0.5 ? (Math.abs(u - 0.2 - v * 0.6) < 0.2 || Math.abs(u - 0.8 + v * 0.6) < 0.2) : Math.abs(u - 0.5) < 0.22,
  diamond: (u, v) => Math.abs(u - 0.5) + Math.abs(v - 0.5) <= 0.62,
  twin: (u, v) => u < 0.4 || u > 0.6 || (v > 0.34 && v < 0.66),
  ring: (u, v) => !(Math.abs(u - 0.5) < 0.2 && Math.abs(v - 0.5) < 0.2),
  cross: (u, v) => Math.abs(u - 0.5) < 0.3 || Math.abs(v - 0.5) < 0.3,
};
const SHAPES_ORDER = ['rect', 'wide', 'heart', 'house', 'Y', 'diamond', 'twin'];   // 部屋 1 の 4 ステージ目からは型を順に
// 部屋 1 の最後のステージ（仕様書第4節の表の「4〜10」の行を、部屋 1 の終わりまで伸ばした。本人判断 2026-09-24: 36〜45 個）
const FIRST_END = Math.max(10, STAGES_PER_ROOM);
const SHAPES_ALL = Object.keys(SHAPES);
const GRID_MAX = 6;   // 横・縦とも最大 6 マス（375 幅で 1 つの物の当たり幅 44px 以上）
// 層の重ね方: d = 斜めに半マスずらす（下の 4 つのうち 3 つ以上に乗る）・h = 横に半マス（下の 2 つに乗る）・s = 真上（下の 1 つに乗る）
const STACKS = [['d'], ['h'], ['d', 's'], ['h', 'd'], ['d', 'h', 's']];

// ステージ n の目安（仕様書第4節の表）: 種類・物の数・層・型・難しさ（0〜1。種類の並びを入れ替える幅）
function stageParams(n) {
  const room = roomOfStage(n);
  let kinds, count, layers, shape, diff;
  const R = mulberry32(n * 7919 + 17);
  const ramp = (a, b, k) => Math.round(lerp(a, b, clamp(k, 0, 1)));
  // 1〜10 は本人判断（2026-09-24）で物を増やした: 1 = 12 個・2〜3 = 15〜18 個・4〜10 = 27〜36 個で 3 層（部屋 1 が短すぎたため）
  if (n === 1) { kinds = 3; count = 12; layers = 1; shape = 'row'; diff = 0; }
  else if (n <= 3) { kinds = n + 2; count = n === 2 ? 15 : 18; layers = 2; shape = 'rect'; diff = 0.05; }
  else if (n <= FIRST_END) { const k = (n - 4) / Math.max(1, FIRST_END - 4); kinds = ramp(5, 7, k); count = 3 * ramp(12, 15, k); layers = k < 0.5 ? 3 : 4; shape = SHAPES_ORDER[(n - 4) % SHAPES_ORDER.length]; diff = lerp(0.12, 0.3, k); }
  else if (n <= 30) { const k = (n - 11) / 19; kinds = ramp(7, 9, k); count = 3 * ramp(10, 15, k); layers = n <= 20 ? 3 : 4; shape = SHAPES_ALL[Math.floor(R() * SHAPES_ALL.length)]; diff = lerp(0.35, 0.55, k); }
  else if (n <= 60) { const k = (n - 31) / 29; kinds = ramp(9, 11, k); count = 3 * ramp(15, 20, k); layers = n <= 45 ? 4 : 5; shape = SHAPES_ALL[Math.floor(R() * SHAPES_ALL.length)]; diff = lerp(0.55, 0.75, k); }
  else { const k = (n - 61) / 40; kinds = ramp(11, 12, k); count = 3 * ramp(20, 25, k); layers = n <= 80 ? 5 : 6; shape = SHAPES_ALL[Math.floor(R() * SHAPES_ALL.length)]; diff = lerp(0.75, 0.85, k); }
  // 部屋 1 は物が 6 種しかない（前の部屋が無い）ので種類は 6 まで
  const pool = poolFor(n);
  kinds = Math.min(kinds, pool.length, count / 3);
  const stack = n === 1 ? ['d'] : STACKS[Math.floor(R() * STACKS.length)];
  return { n, room, kinds, count, layers, shape, diff, stack, pool };
}
// 使える物: その部屋の 6 種＋前の部屋の物（部屋 3 なら 1〜3 の物）。おかわりは全部屋の物
function poolFor(n) { const r = roomOfStage(n), top = isEncore(n) ? ROOMS - 1 : r, out = []; for (let q = 0; q <= top; q++) for (let i = 0; i < 6; i++) out.push(q * 6 + i); return out; }

// 型と大きさから層を積む。rng は山ごとの乱数。戻り値 = [{x, y, z}]
function stackLayers(shape, C, Rw, L, stack, rng) {
  const fn = SHAPES[shape] || SHAPES.rect, out = [];
  let prev = [];
  for (let j = 0; j < Rw; j++) for (let i = 0; i < C; i++) if (fn((i + 0.5) / C, (j + 0.5) / Rw)) prev.push({ x: 2 * i, y: 2 * j, z: 0 });
  if (!prev.length) return out;
  out.push(...prev);
  let off = [0, 0];
  for (let z = 1; z < L; z++) {
    const kind = stack[(z - 1) % stack.length];
    const noff = kind === 'd' ? [1 - off[0], 1 - off[1]] : kind === 'h' ? [1 - off[0], off[1]] : off.slice();
    const need = kind === 'd' ? 3 : kind === 'h' ? 2 : 1;
    const layer = [];
    for (let y = noff[1]; y <= 2 * Rw - 2; y += 2) for (let x = noff[0]; x <= 2 * C - 2; x += 2) {
      let sup = 0; for (const p of prev) if (Math.abs(p.x - x) < 2 && Math.abs(p.y - y) < 2) sup++;
      if (sup >= need && (kind !== 's' || rng() < 0.7)) layer.push({ x, y, z });
    }
    if (!layer.length) break;
    out.push(...layer); prev = layer; off = noff;
  }
  return out;
}

// 物だけの画像（タイル無し。散らかった床・一覧に使う）: 箱 [-10, 110] を px×1.2 の画像にする
const SPRITES = new Map();
function itemSprite(k, px) {
  px = Math.max(8, Math.round(px));
  const key = k + '|' + px;
  let cv = SPRITES.get(key); if (cv) return cv;
  if (SPRITES.size > 300) SPRITES.clear();
  cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(px * 1.2);
  const c = cv.getContext('2d');
  c.translate(px * 0.1, px * 0.1); c.scale(px / 100, px / 100);
  try { ITEM_DRAW[k](makePainter(c)); } catch (e) { c.fillStyle = ITEM_COL[k] || PAL.terra; c.beginPath(); c.arc(50, 50, 40, 0, TAU); c.fill(); }
  SPRITES.set(key, cv);
  return cv;
}
function drawItem(k, cx, cy, s, o) {
  const im = itemSprite(k, s * view.dpr), d = s * 1.2;
  ctx.save(); ctx.translate(cx, cy);
  if (o && o.rot) ctx.rotate(o.rot);
  if (o && (o.sx || o.sy)) ctx.scale(o.sx || 1, o.sy || 1);
  if (o && o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.drawImage(im, -d / 2, -d / 2, d, d);
  ctx.restore();
}
// タイル（クリーム #FFF8EE の角丸 14px・下に 4px の厚み #E9D6BF・影は真下）に物を乗せた画像。
// mode: 'n' = 上に見えている（元の色＋ごく薄い白のフチ）・'d' = 覆われている（明るさ 60%・彩度 70%）
const TILES = new Map();
function tileGeom(cell) { return { th: Math.max(3, cell * 0.075), r: Math.min(14, cell * 0.25), pad: Math.ceil(cell * 0.16) + 2 }; }
function tileSprite(k, cell, mode) {
  const dpr = view.dpr, key = k + '|' + Math.round(cell * dpr) + '|' + mode;
  let cv = TILES.get(key); if (cv) return cv;
  if (TILES.size > 260) TILES.clear();
  const g = tileGeom(cell), W = cell + g.pad * 2, H = cell + g.th + g.pad * 2;
  cv = document.createElement('canvas'); cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.translate(g.pad, g.pad);
  // 影（真下。全部品と同じ向き・タイルは小さい部品なので強さ 0.45 倍）
  c.save(); c.shadowColor = SHADOW.color; c.shadowBlur = SHADOW.blur * 0.45; c.shadowOffsetY = SHADOW.dy * 0.45; c.fillStyle = PAL.tileSide; c.beginPath(); c.roundRect(0, g.th, cell, cell, g.r); c.fill(); c.restore();
  c.strokeStyle = PAL.ink; c.lineWidth = 1.4; c.beginPath(); c.roundRect(0, g.th, cell, cell, g.r); c.stroke();
  const gr = c.createLinearGradient(0, 0, 0, cell); gr.addColorStop(0, '#FFFCF6'); gr.addColorStop(1, PAL.tile);
  c.fillStyle = gr; c.beginPath(); c.roundRect(0, 0, cell, cell, g.r); c.fill();
  c.strokeStyle = PAL.ink; c.lineWidth = 1.4; c.stroke();
  const s = cell * 0.8, im = itemSprite(k, s * dpr);
  c.drawImage(im, cell / 2 - s * 0.6, cell / 2 - s * 0.6 + cell * 0.01, s * 1.2, s * 1.2);
  if (mode === 'd') {
    const d = c.getImageData(0, 0, cv.width, cv.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { const l = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2]; for (let q = 0; q < 3; q++) a[i + q] = (l + (a[i + q] - l) * 0.7) * 0.6; }
    c.putImageData(d, 0, 0);
  } else {
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.beginPath(); c.roundRect(2.2, 2.2, cell - 4.4, cell - 4.4, Math.max(2, g.r - 2)); c.stroke();
  }
  TILES.set(key, cv);
  return cv;
}
// タイルを左上 (x, y)・大きさ cell で描く
function drawTile(k, x, y, cell, mode, o) {
  const g = tileGeom(cell), im = tileSprite(k, cell, mode);
  const W = cell + g.pad * 2, H = cell + g.th + g.pad * 2;
  if (o && (o.sx || o.sy || o.rot)) {
    ctx.save(); ctx.translate(x + cell / 2, y + cell / 2); if (o.rot) ctx.rotate(o.rot); ctx.scale(o.sx || 1, o.sy || 1);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.drawImage(im, -cell / 2 - g.pad, -cell / 2 - g.pad, W, H); ctx.restore(); return;
  }
  if (o && o.alpha != null) { ctx.save(); ctx.globalAlpha *= o.alpha; ctx.drawImage(im, x - g.pad, y - g.pad, W, H); ctx.restore(); return; }
  ctx.drawImage(im, x - g.pad, y - g.pad, W, H);
}

// ---------- 画面の並べ方（仕様書第9節。縦長・横長・PC） ----------
// 縦長: 山は中央（画面の 55% ほど）・トレイと道具は下・しきぶは右下（腰から上。トレイの棚板が腰を隠す）
// 横長: 山は左〜中央・トレイは右端に縦 7 マス・そのとなりによけ場・しきぶは右上（全身）・道具はしきぶの左に縦
// PC: 山は中央・トレイと道具は下・しきぶは右（全身）
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, dpr: 1 };
const WAIST_VIS = () => -ENV.y0 - PD.cut;   // 腰から一番高い手の先まで（ポーズ画像の px）
const TH_K = 0.075, LIFT_K = 0.05;          // タイルの厚み・層ごとの持ち上げ（1 マスに対する割合）
const PILE_Z_MAX = 7;                        // 場所を取るときに見込む層の数（最大の山でも入る）
function computeLayout() {
  const W = view.w, H = view.h;
  const mode = H >= W ? 'portrait' : H < 600 ? 'land' : 'pc';
  const m = mode === 'pc' ? 18 : mode === 'land' ? 8 : 10;
  const L = { W, H, mode, m };
  const toggle = (x, y, r, key) => { const lf = clamp(r * 0.64, 10, 14); return { x, y, r, lf, ly: y + r + 4 + lf * 0.6, key }; };
  // 効果音・BGM の切替は第2弾と同じ「小さな丸」（部屋ボタンの 0.82 倍・文字は丸の 0.72 倍）。hw = 文字も入れた半分の幅。右上に 部屋・効果音・BGM の順
  const sound = (xr, y, br, gap, gap2) => {
    const r = br * 0.82, lf = clamp(r * 0.72, 10, 14), hw = Math.max(r, lf * 1.6), mk = (x, key) => ({ x, y, r, lf, ly: y + r + 4 + lf * 0.6, key });
    L.btnBgm = mk(xr - hw, 'bgm'); L.btnSfx = mk(L.btnBgm.x - hw * 2 - gap, 'sfx');
    L.btnRooms = toggle(L.btnSfx.x - hw - gap2 - br, y, br, 'rooms');
    L.btnBgm.ly = L.btnSfx.ly = L.btnRooms.ly;   // 下の文字の行は 3 つでそろえる
  };
  if (mode === 'portrait') {
    const ph = clamp(W * 0.1, 34, 46), top = 8, br = clamp(ph * 0.5, 17, 23);
    sound(W - m, top + br, br, 4, 10);
    L.pill = { x: m, y: top, h: ph, x1: L.btnRooms.x - br - 8 };
    L.meter = { x: m, y: top + ph + 8, w: L.btnRooms.x - br - 12 - m, h: clamp(ph * 0.46, 16, 22) };
    const hudB = Math.max(L.meter.y + L.meter.h, L.btnRooms.ly + L.btnRooms.lf * 0.7) + 6;
    L.hud = { x: 0, y: 0, w: W, h: hudB };
    const tp = clamp(W * 0.02, 6, 10), s = Math.min((W - 2 * m - 2 * tp) / TRAY_N, 64), shelf = s * 0.22;
    const tw = s * TRAY_N + 2 * tp, th = s + 2 * tp + shelf, ty = H - m - th;
    L.tray = { dir: 'row', x: (W - tw) / 2, y: ty, w: tw, h: th, s, tp, shelf };
    // しきぶ（腰から上）
    const sc = Math.min(W * 0.25 / 216, (H * 0.2) / WAIST_VIS());
    const waistY = ty, gx = W - 4 - ENV.x1 * sc;   // 腰はトレイの上端でちょうど切る（トレイと重ねない）
    L.chr = { mode: 'waist', s: sc, gx, gy: waistY + PD.cut * sc, clipY: waistY };
    const chrTop = waistY - WAIST_VIS() * sc, chrLeft = gx + ENV.x0 * sc;
    // 道具（左の 3 つ）とよけ場（道具の上）
    const r = clamp(W * 0.068, 22, 30), lf = clamp(r * 0.5, 11, 14), rx0 = m, rx1 = chrLeft - 6;
    const toolY = ty - 8 - lf - 6 - r;
    L.tools = TOOLS.map((k, i) => ({ key: k, x: lerp(rx0, rx1, (i + 0.5) / 3), y: toolY, r, lf, ly: toolY + r + 6 + lf * 0.5 }));
    const as = s * 0.9, ay = toolY - r - 10 - as / 2;
    L.aside = { s: as, slots: [0, 1, 2].map(q => ({ x: (rx0 + rx1) / 2 + (q - 1) * (as + 8), y: ay })) };
    const bandTop = Math.min(chrTop - 4, ay - as / 2 - 6);
    L.pileArea = { x: m, y: hudB + 4, w: W - 2 * m, h: bandTop - 6 - (hudB + 4) };
    L.floorK = 0.6;
  } else if (mode === 'land') {

  solve: (n, kind, seed) => { const S = makeStage(n); return solvePile(S.tiles, S.above, kind || 'skill', seed != null ? mulberry32(seed) : null); },
  // わざと作った山（覆いの計算の確かめ）: [[x, y, z, k], ...]
  customPile: arr => { G.scene = 'play'; G.modal = null; G.tiles = arr.map((a, i) => ({ i, x: a[0], y: a[1], z: a[2], k: a[3] != null ? a[3] : 0, gone: false, unc: -1e9 })); G.above = computeAbove(G.tiles); G.grid = { w: Math.max(...G.tiles.map(t => t.x)) + 2, h: Math.max(...G.tiles.map(t => t.y)) + 2, z: Math.max(...G.tiles.map(t => t.z)) }; G.tray = []; G.aside = []; G.ghosts = []; G.fail = null; G.clearing = null; G.used = { undo: false, aside: false, shuffle: false }; G.layout = null; },
  coveredList: () => G.tiles.map(t => coveredFast(t.i)),
  // その物が一番上に見えている点（覆われている物でも、見えている角があればそこ）。無ければ null
  visiblePoint: i => { const r = tileRect(i); for (let a = 1; a < 12; a++) for (let b2 = 1; b2 < 12; b2++) { const x = r.x + r.w * a / 12, y = r.y + r.h * b2 / 12; if (tileAt(x, y) === i) return { x, y }; } return null; },
  tileRect: i => tileRect(i), tileAt: (x, y) => tileAt(x, y), traySlot: q => traySlotPos(q), asidePos: q => asidePos(q),
  layout: () => { const L = lay(); return { W: L.W, H: L.H, mode: L.mode, hud: L.hud, pill: L.pill, meter: L.meter, btnRooms: L.btnRooms, btnSfx: L.btnSfx, btnBgm: L.btnBgm, tray: L.tray, tools: L.tools, aside: L.aside, pileArea: L.pileArea, pile: L.pile, cellMin: L.cellMin, chr: L.chr }; },
  failLayout: () => failLayout(lay()), cardLayout: () => cardLayout(lay()),
  envelope: () => envelopeRect(lay()), poseRect: k => poseRect(lay(), k), poseKeys: () => Object.keys(PD.poses), pose: () => POSE.cur, poseLog: () => POSE.log.slice(),
  footPoints: () => { const L = lay(); return Object.keys(PD.poses).map(k => { const r = poseRect(L, k), p = poseMeta(k), s = L.chr.s; return { k, x: r.x + p.ax * s, y: r.y + p.ay * s }; }); },
  forcePose: k => { POSE.cur = k; POSE.since = now(); POSE.fade = null; POSE.react = { pose: k, dur: 1e9, at: now(), shownAt: now(), kind: 'test' }; },
  sweatAll: flow => { G.sweat = []; spawnSweat(5, ['M'], Object.keys(SWEAT_PTS), flow || 4000); G.sweatNext = now() + 1e9; },
  sweatRects: () => { const L = lay(), f = chrFrame(L), p = poseMeta(POSE.cur), t = now(); return G.sweat.filter(q => t >= q.t0).map(q => { const e = t - q.t0; const k = e < SWEAT_APPEAR ? 0 : Math.min(1, Math.pow((e - SWEAT_APPEAR) / q.flow, 2)); const g = sweatGeom(p, q.id, k, q.size); return { id: q.id, x: f.gx + (g.x - p.ax) * f.s, y: f.gy + (g.y - p.ay) * f.s, w: g.w * f.s, h: g.h * f.s }; }); },
  faceRectScreen: () => { const L = lay(), f = chrFrame(L), p = poseMeta(POSE.cur), F = p.face; return { x: f.gx + (F[0] - p.ax) * f.s, y: f.gy + (F[1] - p.ay) * f.s, w: (F[2] - F[0]) * f.s, h: (F[3] - F[1]) * f.s }; }, worry: () => G.worry, sweatCount: () => G.sweat.length,
  idleFor: ms => { POSE.lastInput = now() - ms; POSE.longIdle.next = 0; POSE.longIdle.until = 0; G.lastInput = now() - ms; }, hint: () => hintTile(),
  advance: ms => { CLOCK.skew += ms; FX.t += ms; updateLogic(now(), ms); return now(); },
  seed: n => { rand = mulberry32(n >>> 0); },
  clearFx: () => { finishGhosts(); G.particles = []; G.rings = []; G.popups = []; G.edge = null; G.flash = null; G.anims = G.anims.filter(a => a.kind !== 'shuffle'); for (const e of visTray()) { e.fly = null; e.vx = null; } },
  // セーブ
  snapshot: () => { const d = Save.build(); delete d.stats; return JSON.parse(JSON.stringify(d)); }, flush: () => Save.flush(), parseSave: raw => Save.parse(raw), saveLen: () => Save.lastLen, saveWrites: () => Save.writes,
  platform: () => ({ env: Platform.env, calls: Platform.calls.slice() }), paused: () => G.paused, ready: () => G.ready, frames: () => G.frames, clock: () => now(), lang: () => LANG,
  sound: () => ({ userMuted: Sound.userMuted, enabled: Sound.enabled, tones: Sound.tones, ctx: Sound.ctx ? Sound.ctx.state : null, loaded: Sound.loaded, decoded: SFX.decoded, last: Sound.last }),
  bgm: () => Object.assign(BGM.state(), { bgmOn: Sound.bgmOn, loaded: Sound.bgmLoaded, ctx: Sound.ctx ? Sound.ctx.state : null }),
  bgmReady: () => Promise.resolve(Sound.bgmLoading), toggleBgm: () => toggleBgm(),
  toggleSfx: () => toggleSfx(), settings: () => ({ sfx: !Sound.userMuted, bgm: Sound.bgmOn }), unlockAudio: () => Sound.unlock(),
  fontLoaded: () => document.fonts.check('900 20px TidyRound') && document.fonts.check('400 20px TidyMincho') && document.fonts.check('400 20px TidyPop'),
  missingAssets: () => Object.keys(IMG).filter(n => !ready(IMG[n])),
  textBoxes: () => { TEXT_LOG = []; try { render(); } finally { const r = TEXT_LOG; TEXT_LOG = null; return r; } },
  strings: () => JSON.parse(JSON.stringify(STR)), names: () => JSON.parse(JSON.stringify(NAMES)),
  fps: ms => new Promise(res => { let n = 0; const t0 = performance.now(); (function f() { n++; if (performance.now() - t0 < ms) requestAnimationFrame(f); else res(Math.round(n * 1000 / (performance.now() - t0) * 10) / 10); })(); }),
  // 演出の確かめ用: クリアの流れ・お披露目・カード・失敗・全部屋ピカピカを直接出す
  forceReveal: r => { G.modal = null; G.scene = 'reveal'; G.reveal = { t0: fxNow(), room: r, final: false }; },
  forceAllClear: () => { G.modal = null; G.scene = 'allclear'; G.allFx = { t0: fxNow() }; G.reveal = null; },
  forceFail: () => { G.fail = { t0: fxNow(), n: ++G.stats.fails }; setReact('fail'); },
  momPeek: () => { G.mom = { t0: fxNow() }; },
  // 部屋の絵だけを画面いっぱいに描く（色の検査用）
  renderRoom: (r, lv, dim) => { const L = lay(); BG.key = ''; ctx.save(); ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); paintRoom(ctx, L.W, L.H, r, lv, { dim: !!dim, fk: L.floorK }); ctx.restore(); },
  renderPileOnly: () => { const L = lay(); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, L.W, L.H); drawPile(L); },
};

// ---------- 起動 ----------
// 順序: 一時停止・音声の購読 → 壁の色だけの 1 枚を描いて firstFrameReady → 言語・セーブ（loadData）・画像・書体 → タイトルを描いて gameReady
(async function boot() {
  Platform.onPause(pauseGame);
  Platform.onResume(resumeGame);
  Sound.enabled = Platform.isAudioEnabled();
  Platform.onAudioEnabledChange(v => { Sound.enabled = v; Sound.sync(); });
  Sound.setup();
  Sound.music('title');   // 復号が済んだらタイトルの曲（設定を読むまで BGM の出口は 0）
  resize();
  const g = ctx.createLinearGradient(0, 0, 0, view.h); g.addColorStop(0, ROOM_PAL[0].wall); g.addColorStop(1, darker(ROOM_PAL[0].wall, 0.05)); ctx.fillStyle = g; ctx.fillRect(0, 0, view.w, view.h);
  Platform.firstFrameReady();
  LANG = langOf(await Platform.getLanguage());
  document.documentElement.lang = LANG;
  const sp = new URLSearchParams(location.search).get('seed'); if (sp) rand = mulberry32(+sp >>> 0);
  applySave(await Save.load());
  Sound.userMuted = !Save.data.settings.sfx;
  Sound.setBgm(Save.data.settings.bgm, true);
  await Promise.all([loadImages(), document.fonts.load('900 20px TidyRound').catch(() => {}), document.fonts.load('400 20px TidyMincho').catch(() => {}), document.fonts.load('400 20px TidyPop').catch(() => {})]);
  G.titleT0 = fxNow(); G.ready = true; FX.last = performance.now();
  schedule();
  Sound.sync();
})();
</script>
