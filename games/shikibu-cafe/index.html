   しきぶの合体カフェ（仮）— v1
   仕様は docs/仕様書_v1.md、見た目の値は docs/アートディレクション_v1.md。
   素の HTML/JS/Canvas。外部通信なし（SDK だけは YouTube が配る）。ブラウザ保存・ページ可視性・ブラウザの言語設定は使わない（tools/build_dist.py が検査）。
   SDK のスタブ・Platform・Save の形・しきぶのポーズの状態機械・汗・ボタンの描き方は第1弾（ref/sort-game/index.html）から移植。
   ===================================================================== */

// ---------- SDK のスタブ（YouTube の外で使う。本物の ytgame と同じ形・同じ戻り値の型。第1弾から移植） ----------
// window.__ytStubInit = { data, lang, audio } で初期状態を渡せる（テスト用）。言語は ?lang= でも変えられる。
function makeStubSdk(init) {
  init = init || {};
  const subs = { pause: [], resume: [], audio: [] };
  const on = (list, cb) => { list.push(cb); return () => { const i = list.indexOf(cb); if (i >= 0) list.splice(i, 1); }; };
  const emit = (list, v) => list.slice().forEach(f => { try { f(v); } catch (e) { /* 呼び出し先の例外で止めない */ } });
  const st = { data: typeof init.data === 'string' ? init.data : '', audio: init.audio !== false, lang: init.lang || new URLSearchParams(location.search).get('lang') || 'ja', score: null };
  const fail = type => { const e = new Error(type); e.errorType = type; return Promise.reject(e); };
  const sdk = {
    IN_PLAYABLES_ENV: false, SDK_VERSION: 'stub',
    game: {
      firstFrameReady() {}, gameReady() {},
      loadData() { return Promise.resolve(st.data); },
      saveData(s) { if (typeof s !== 'string') return fail('INVALID_PARAMS'); if (s.length * 2 > 3 * 1024 * 1024) return fail('SIZE_LIMIT_EXCEEDED'); st.data = s; return Promise.resolve(); },
    },
    system: {
      getLanguage() { return Promise.resolve(st.lang); },
      isAudioEnabled() { return st.audio; },
      onAudioEnabledChange(cb) { return on(subs.audio, cb); },
      onPause(cb) { return on(subs.pause, cb); },
      onResume(cb) { return on(subs.resume, cb); },
    },
    engagement: {
      sendScore(o) { if (!o || !Number.isFinite(o.value)) return fail('INVALID_PARAMS'); st.score = Math.max(st.score || 0, o.value); return Promise.resolve(); },
      openYTContent() { return Promise.resolve(); },
    },
    health: { logError() {}, logWarning() {} },
  };
  sdk.__stub = { state: st, pause: () => emit(subs.pause), resume: () => emit(subs.resume), setAudio: v => { st.audio = !!v; emit(subs.audio, st.audio); } };
  return sdk;
}

// ---------- Platform: ゲームから SDK を呼ぶ唯一の窓口（第1弾から移植） ----------
const Platform = (() => {
  const real = (typeof ytgame !== 'undefined' && ytgame && ytgame.game && ytgame.IN_PLAYABLES_ENV !== false) ? ytgame : null;
  const sdk = real || makeStubSdk(window.__ytStubInit);
  const calls = [];
  const call = (name, f, def) => { calls.push(name); try { return f(); } catch (e) { return def; } };
  const P = {
    env: real ? 'youtube' : 'stub', sdk, calls,
    firstFrameReady() { call('firstFrameReady', () => sdk.game.firstFrameReady()); },
    gameReady() { call('gameReady', () => sdk.game.gameReady()); },
    async getLanguage() { try { return String((await call('getLanguage', () => sdk.system.getLanguage(), '')) || ''); } catch (e) { return ''; } },
    async loadData() { try { const s = await call('loadData', () => sdk.game.loadData(), ''); return typeof s === 'string' ? s : ''; } catch (e) { P.logWarning(); return ''; } },
    saveData(str) { return Promise.resolve(call('saveData', () => sdk.game.saveData(str))).catch(() => P.logWarning()); },
    isAudioEnabled() { return call('isAudioEnabled', () => sdk.system.isAudioEnabled() !== false, true); },
    onAudioEnabledChange(cb) { call('onAudioEnabledChange', () => sdk.system.onAudioEnabledChange(v => cb(!!v))); },
    onPause(cb) { call('onPause', () => sdk.system.onPause(cb)); },
    onResume(cb) { call('onResume', () => sdk.system.onResume(cb)); },
    sendScore(n) { Promise.resolve(call('sendScore', () => sdk.engagement.sendScore({ value: n | 0 }))).catch(() => {}); },
    logError() { call('logError', () => sdk.health.logError()); },
    logWarning() { call('logWarning', () => sdk.health.logWarning()); },
  };
  return P;
})();
window.addEventListener('error', () => Platform.logError());

// ---------- 文字（日英。言語は Platform.getLanguage() だけで決める。ja で始まれば日本語、それ以外は英語） ----------

        up_wall: 'Wallpaper', up_floor: 'Floor', up_plant: 'Plants', up_sign: 'Sign', up_lamp: 'Lamps', up_showcase: 'Showcase',
        ef_charges: 'Uses {n}', ef_speed: 'Refill {n}s', ef_p2: 'Tier 2: {n}%', ef_seats: 'Seats {n}', ef_board: 'Cells {n}', ef_tray: 'Tray {n}, {h}h', ef_tip: 'Tips +{n}%',
        shopTitle: 'Shop upgrades', bookTitle: 'Menu book', signName: 'Café Shikibu', signShort: 'CAFÉ', sfx: 'SFX', bgm: 'Music' },
};
// お菓子の名前（3 系統 × 8 段。仕様書第4節）
const NAMES = {
  ja: [['小麦粉', 'ロールパン', 'クロワッサン', 'メロンパン', 'サンドイッチ', 'パンケーキ', 'フレンチトースト', 'パンのタワー'],
       ['たまご', 'クッキー', 'カップケーキ', 'ドーナツ', 'ショートケーキ', 'パフェ', 'ホールケーキ', '5段ウエディングケーキ'],
       ['コーヒー豆', 'エスプレッソ', 'カフェラテ', 'ココア', 'クリームソーダ', 'タピオカミルクティー', '虹色ソーダ', '王冠の特製ドリンク']],
  en: [['Flour', 'Bread Roll', 'Croissant', 'Melon Bun', 'Sandwich', 'Pancakes', 'French Toast', 'Bread Tower'],

       ['Coffee Beans', 'Espresso', 'Café Latte', 'Cocoa', 'Cream Soda', 'Bubble Tea', 'Rainbow Soda', 'Royal Crown Drink']],

let LANG = 'en';
function langOf(tag) { return String(tag || '').toLowerCase().startsWith('ja') ? 'ja' : 'en'; }
function T(k, vars) { let s = (STR[LANG] || STR.en)[k]; if (s == null) s = STR.en[k] != null ? STR.en[k] : k; if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; }

// ---------- 配色（アートディレクション第1節。ここ以外で色を決めない） ----------
const PAL = {
  wallTop: '#FBEFE3', wallBot: '#F6E2CF', light: 'rgba(255,244,214,.55)',
  sage: '#A8CBB0', sageGrain: '#94BA9E',

const MAX_TIER = 8;
const chainOf = id => Math.floor(id / 10) - 1;
const tierOf = id => id % 10;
const makeId = (chain, tier) => (chain + 1) * 10 + tier;
const isItem = id => Number.isInteger(id) && id >= 11 && id <= 38 && tierOf(id) >= 1 && tierOf(id) <= MAX_TIER;
const ALL_IDS = [0, 1, 2].flatMap(c => [1, 2, 3, 4, 5, 6, 7, 8].map(t => makeId(c, t)));
const CHAINS = [
  { key: 'bread', tool: 'oven', unlockDay: 1 },
  { key: 'sweets', tool: 'whisk', unlockDay: 3 },
  { key: 'drink', tool: 'coffee', unlockDay: 6 },
];
// 焼く道具のレベル（1〜5）: 回数の上限・1 回分が戻る時間・2 段目が出る確率
const TOOL_LV = [null,
  { max: 12, rech: 4000, p2: 0.10 },
  { max: 16, rech: 4000, p2: 0.10 },
  { max: 16, rech: 3000, p2: 0.15 },
  { max: 20, rech: 3000, p2: 0.20 },
  { max: 24, rech: 2500, p2: 0.30 }];
const BOARD_SIZES = [[6, 6], [6, 7], [7, 7]];   // [列, 行]。台を広げる 2 回
const SEATS = [3, 4, 5];
const TRAY = [{ max: 20, capH: 2 }, { max: 40, capH: 4 }];
const IDLE_MS = 60000;          // 閉じている間、60 秒に 1 個
const GREAT_P = 0.05;           // 大成功（2 段上がる）
const COMBO_MS = 1200;          // 連続合体の間隔
const COMBO_SERVE_MS = 4000;    // コンボの上乗せが「出す」に効く時間（合体からこの時間以内に出す）
const FAST_MS = 10000;          // 「はやい！」
const ARRIVE_MS = 800;          // 席が空いてから次の客が来るまで
const HINT_MS = 6000;           // さわらないとヒント
const INTERIOR = ['wall', 'floor', 'plant', 'sign', 'lamp', 'showcase'];
const TIP_BY_TIER = [0, 0.02, 0.035, 0.05];   // 内装 1 種の段ごとのチップ
const LEGEND_TIP = 0.10;                        // 伝説のお菓子を台に飾ると 1 つにつき +10%（3 つまで）
// 改装の値段（仕様書第10節の目安に合わせて bot で調整した値。docs/報告_v1.md）
const SHOP = {

  seats:  { prices: [240, 1400], hearts: [0, 80], day: 2 },

const SHOP_ORDER = ['oven', 'whisk', 'coffee', 'seats', 'board', 'tray', 'wall', 'floor', 'plant', 'sign', 'lamp', 'showcase'];
function toolKeyOf(chain) { return CHAINS[chain].tool; }
function ordersForDay(d) { return Math.min(14, 5 + d); }
function coinsFor(tier) { return 5 * Math.pow(2, tier - 1); }

// ---------- 時計・乱数 ----------
// ゲームの時計。一時停止中は止まり、再開後は止まっていた時間を差し引く。skew はテスト用（Game.advance で時間を早送りする）
const CLOCK = { off: 0, at: 0, stopped: false, skew: 0 };
const now = () => (CLOCK.stopped ? CLOCK.at : performance.now()) - CLOCK.off + CLOCK.skew;
// 演出の時計（0.15 秒のスローモーションの間だけ遅く進む。入力と遊びの判定はふつうの時計で動く）
const FX = { t: 0, last: 0, slowUntil: 0 };
const fxNow = () => FX.t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = Math.random;   // テストは Game.seed(n) で固定できる

// ---------- ゲームの状態（G がすべての正本。セーブは G から作り、G へ戻す） ----------
const G = {

function freshStats() { return { merges: 0, serves: 0, taps: 0, sells: 0, playMs: 0, firstT5: -1, legend: [null, null, null], great: 0, maxCombo: 0, fast: 0, days: 0, fullTaps: 0 }; }
function freshDayStats() { return { orders: 0, coins: 0, hearts: 0, fast: 0, newFound: [], maxCombo: 0, legends: 0, sells: 0, t0: G.stats ? G.stats.playMs : 0, ms: 0 }; }

const toolLv = c => TOOL_LV[G.tools[c].lv];
const seatCount = () => SEATS[G.up.seats];
const trayMax = () => TRAY[G.up.tray].max;
const maxMade = c => { let m = 0; for (const id of G.found) if (chainOf(id) === c) m = Math.max(m, tierOf(id)); return m; };
function tipPct() {
  let p = 0; for (const k of INTERIOR) p += TIP_BY_TIER[G.up[k]] || 0;
  const legends = G.board.filter(id => id && tierOf(id) === MAX_TIER).length;

// ---------- セーブ（saveData/loadData に JSON 文字列 1 つ。第1弾の Save を移植して中身を合体カフェ用に） ----------
// 形式 v1: { v, day, coins, hearts, board[], tray[], tools[{lv,ch}], upgrades{}, found[], ordersLeft, served, customers[], closed, lastSeen, stats{}, dayStats{} }
// 壊れた・型違いのセーブは項目ごとに既定値へ落とす（落ちない）。版が違っても読める所だけ読む。loadData が済むまで saveData は呼ばない。
const SAVE_VER = 1;
const int = (v, lo, hi, def) => Number.isInteger(v) && v >= lo && v <= hi ? v : def;
const Save = {
  data: null, loaded: false, timer: 0, writes: 0, lastLen: 0,
  parse(raw) {
    let o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    const up = {};
    const u = (o.upgrades && typeof o.upgrades === 'object' && !Array.isArray(o.upgrades)) ? o.upgrades : {};
    up.seats = int(u.seats, 0, SEATS.length - 1, 0); up.board = int(u.board, 0, BOARD_SIZES.length - 1, 0); up.tray = int(u.tray, 0, TRAY.length - 1, 0);
    for (const k of INTERIOR) up[k] = int(u[k], 0, 3, 0);
    const [cols, rows] = BOARD_SIZES[up.board];
    const board = new Array(cols * rows).fill(0);
    if (Array.isArray(o.board)) for (let i = 0; i < board.length && i < o.board.length; i++) if (isItem(o.board[i])) board[i] = o.board[i];
    const tray = Array.isArray(o.tray) ? o.tray.filter(isItem).slice(0, TRAY[up.tray].max) : [];
    const tools = [0, 1, 2].map(c => {
      const t = Array.isArray(o.tools) && o.tools[c] && typeof o.tools[c] === 'object' ? o.tools[c] : {};
      const lv = int(t.lv, 1, 5, 1);
      return { lv, ch: int(t.ch, 0, TOOL_LV[lv].max, TOOL_LV[lv].max) };
    });
    const found = Array.isArray(o.found) ? [...new Set(o.found.filter(isItem))] : [];
    const day = int(o.day, 1, 99999, 1);
    const total = ordersForDay(day);

// 段ごとの表示の大きさ（マスに対して。アートディレクション第2節）
function tierScale(t) { return t <= 2 ? 0.70 : t <= 4 ? 0.78 : t <= 6 ? 0.85 : t === 7 ? 0.90 : 1.05; }
// 画像のしまい場所: 箱 [-10, 110] を px×1.2 の画像にする。mode: 'n' ふつう・'s' 黒板のチョークのシルエット
const SPRITES = new Map();
function sprite(id, px, mode) {
  px = Math.max(8, Math.round(px)); mode = mode || 'n';
  const key = id + '|' + px + '|' + mode;
  let cv = SPRITES.get(key);
  if (cv) return cv;
  if (SPRITES.size > 400) SPRITES.clear();
  cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(px * 1.2);
  const c = cv.getContext('2d');
  c.translate(px * 0.1, px * 0.1); c.scale(px / 100, px / 100);
  try { ITEM_DRAW[id](makePainter(c), c); } catch (e) { c.fillStyle = PAL.chain[chainOf(id)]; c.beginPath(); c.arc(50, 50, 40, 0, TAU); c.fill(); }
  if (mode === 's') { c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = 'rgba(244,241,232,.42)'; c.fillRect(0, 0, cv.width, cv.height); }
  SPRITES.set(key, cv);
  return cv;
}
// お菓子を中心 (cx, cy)・箱の大きさ s（CSS px）で描く
function drawItem(id, cx, cy, s, o) {
  const dpr = view.dpr, im = sprite(id, s * dpr, o && o.mode);
  const d = s * 1.2;
  ctx.save();
  ctx.translate(cx, cy);
  if (o && o.rot) ctx.rotate(o.rot);
  if (o && (o.sx || o.sy)) ctx.scale(o.sx || 1, o.sy || 1);
  if (o && o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.drawImage(im, -d / 2, -d / 2, d, d);
  // 伝説: 虹色のつや（色相が 4 秒で一周）
  if (tierOf(id) === MAX_TIER && !(o && o.mode === 's') && !(o && o.plain)) {
    const n = Math.ceil(d * dpr), k = rainbowCanvas(n), kc = k.getContext('2d');
    kc.setTransform(1, 0, 0, 1, 0, 0); kc.globalCompositeOperation = 'source-over'; kc.clearRect(0, 0, n, n); kc.drawImage(im, 0, 0, n, n);
    kc.globalCompositeOperation = 'source-atop';
    const hue = (fxNow() / 4000 * 360) % 360, g = kc.createLinearGradient(0, 0, n, n);
    for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsla(${(hue + i * 72) % 360},90%,70%,.32)`);
    kc.fillStyle = g; kc.fillRect(0, 0, n, n);
    ctx.drawImage(k, -d / 2, -d / 2, d, d);
  }
  ctx.restore();
}
// 虹色のつや用の下書き（大きさごとに 1 枚。毎回作り直さない）
const RAINBOW = new Map();
function rainbowCanvas(n) { let cv = RAINBOW.get(n); if (!cv) { if (RAINBOW.size > 12) RAINBOW.clear(); cv = document.createElement('canvas'); cv.width = cv.height = n; RAINBOW.set(n, cv); } return cv; }

// ---------- 画面の並べ方（仕様書第8節。縦長・横長・PC） ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, dpr: 1 };
const WAIST_VIS = () => -ENV.y0 - PD.cut;   // 腰から一番高い手の先まで（ポーズ画像の px）
function computeLayout() {
  const W = view.w, H = view.h, portrait = H > W, m = 10;
  const C = G.cols, R = G.rows;
  const L = { W, H, portrait, m, cols: C, rows: R };
  if (portrait) {
    const bp = clamp(W * 0.022, 7, 12), hudH = clamp(W * 0.14, 50, 64), toolH = clamp(Math.min(W, H) * 0.19, 66, 96);
    const sceneMin = clamp(H * 0.38, 150, 320);   // 修正 4b・4c: お客さんの顔（席 4・5 は 2 段）と吹き出しが入る高さ（0.25 → 0.38。375×812 では台 6×7 のマスだけ 56 → 49.5px に）
    const cell = Math.min((W - 2 * m - 2 * bp) / C, (H - hudH - sceneMin - toolH - 2 * bp - 16) / R, 80);
    const bw = C * cell + 2 * bp, bh = R * cell + 2 * bp;
    const left = H - hudH - bh - toolH - 16, sceneH = Math.min(left, H * 0.42), extra = left - sceneH;
    L.hud = { x: 0, y: 0, w: W, h: hudH };
    L.scene = { x: 0, y: hudH, w: W, h: sceneH };
    L.counter = { x: 0, y: hudH + sceneH - clamp(sceneH * 0.11, 16, 28), w: W, h: clamp(sceneH * 0.11, 16, 28) };
    L.board = { x: (W - bw) / 2, y: hudH + sceneH + 6 + extra * 0.25, w: bw, h: bh, bp, cell };
    L.wainY = L.counter.y + L.counter.h;
    const ty = L.board.y + bh + 8 + (H - (L.board.y + bh + 8)) / 2 - 4;
    L.floor = { x: 0, y: L.board.y + bh + 8 + toolH * 0.36, w: W, h: H };
    L.toolBar = { dir: 'row', x0: L.board.x, x1: L.board.x + bw, y: ty, size: Math.min(toolH * 0.86, bw / 5.4) };
    // しきぶ: 右上・腰から上（カウンターが腰を隠す）。枠（全ポーズの外接枠）が HUD と台に入らない倍率
    const visTop = L.scene.y + 4, waistY = L.counter.y + L.counter.h * 0.45;
    const s = Math.min((waistY - visTop) / WAIST_VIS(), W * 0.25 / 216);
    const gx = W - 4 - ENV.x1 * s, gy = waistY + PD.cut * s;
    L.chr = { mode: 'waist', s, gx, gy, clipY: L.counter.y + L.counter.h };
    L.custArea = { x0: m, x1: gx - 110 * s - 4, counterY: L.counter.y };
    L.window = { x: L.custArea.x0 + (L.custArea.x1 - L.custArea.x0) * 0.5, w: Math.min(sceneH * 0.62, (L.custArea.x1 - L.custArea.x0) * 0.46), top: L.scene.y + sceneH * 0.16, bot: L.counter.y };
  } else {
    const bp = clamp(H * 0.022, 7, 12), toolH = clamp(H * 0.15, 60, 100);
    const cap = clamp(Math.min(W, H) * 0.1, 60, 112), cellA = Math.min((H - 2 * m - toolH - 8 - 2 * bp) / R, cap), cellB = Math.min((H - 2 * m - 2 * bp) / R, cap);
    const below = cellA >= 52;
    let cell = below ? cellA : cellB;
    const sceneMin = clamp(W * 0.3, 280, 560), side = below ? 0 : toolH * 0.9 + 8;
    cell = Math.min(cell, (W - sceneMin - 3 * m - side - 2 * bp) / C);
    const bw = C * cell + 2 * bp, bh = R * cell + 2 * bp;
    let sceneW = Math.max(sceneMin, W - (bw + side + 3 * m));
    sceneW = Math.min(sceneW, Math.max(sceneMin, W * 0.46));
    const areaW = W - sceneW;
    const hudH = clamp(H * 0.13, 46, 92);
    const bx = side + (areaW - side - bw) / 2 + (below ? 0 : m * 0.5), by = below ? (H - bh - toolH - 8) / 2 : (H - bh) / 2;
    L.hud = { x: areaW, y: 0, w: sceneW, h: hudH };
    L.board = { x: bx, y: by, w: bw, h: bh, bp, cell };
    L.scene = { x: areaW, y: hudH, w: sceneW, h: H - hudH };
    L.wainY = Math.max(H * 0.36, by + bh * 0.18);
    L.floor = { x: 0, y: H - clamp(H * 0.07, 16, 60), w: areaW, h: H };
    if (below) L.toolBar = { dir: 'row', x0: bx, x1: bx + bw, y: by + bh + 8 + toolH / 2, size: Math.min(toolH * 0.9, bw / 6) };
    else L.toolBar = { dir: 'col', x: bx - 8 - toolH * 0.45, y0: by, y1: by + bh, size: Math.min(toolH * 0.86, bh / 5.4) };
    // しきぶ: 右下・全身（カウンターの前に立つ）
    const cy = hudH + (H - hudH) * 0.5, gy = H - 6;
    const s = Math.min((gy - (cy - (H - cy) * 0.35)) / ENV.h, sceneW * 0.4 / ENV.w);
    const gx = W - 6 - ENV.x1 * s;
    L.chr = { mode: 'full', s, gx, gy, clipY: H };
    L.counter = { x: areaW, y: cy, w: sceneW, h: H - cy };
    L.strip = { x0: areaW + 6, w: sceneW * 0.17 };
    L.custArea = { x0: areaW + 10 + L.strip.w, x1: gx - 110 * s - 6, counterY: cy };
    L.window = { x: (L.custArea.x0 + L.custArea.x1) / 2, w: Math.min((L.custArea.x1 - L.custArea.x0) * 0.42, (cy - hudH) * 0.5), top: hudH + (cy - hudH) * 0.12, bot: cy };
  }
  // 焼く道具の並び: トレイ・オーブン・泡立て器・コーヒーマシン・ゴミ箱（ゴミ箱は台の角のそば）
  const tb = L.toolBar, n = 5;

  for (let i = 0; i < n; i++) {
    const k = (i + 0.5) / n;
    L.slots.push(tb.dir === 'row' ? { x: lerp(tb.x0, tb.x1, k), y: tb.y, r: tb.size / 2 } : { x: tb.x, y: lerp(tb.y0, tb.y1, k), r: tb.size / 2 });
  }

  const hh = L.hud.h, bs = clamp(hh * 0.72, 36, 62), yc = L.hud.y + hh / 2 + 1;

// タイトルの 1 字ずつ（Mochiy Pop One）。k = 塗りの組の始まり（字ごとに順に回す）。返り値 = 全体の幅
const POP_FILLS = [['#F7B08C', PAL.terra], ['#FFB3C8', PAL.berry], ['#FFE39A', '#F2B63C']];

  const ws = chars.map(c => ctx.measureText(c).width), tr = px * 0.02, total = ws.reduce((a, b) => a + b, 0) + tr * (chars.length - 1);
  // 1 字ずつの位置・傾き・弾み。フチ（インク → 白）を全部の字に先に描いてから塗る（隣の字のフチが塗りに重ならないように）

// ---------- ループ（1 本だけ。一時停止中は回さない） ----------
let rafId = 0;
// 入力 → 描画の測り方: samples = 押してから反応を描き終えるまで（画面の書き換えを待つ時間を含む）、work = 押したときの処理＋次の 1 枚を描く時間（ゲーム自身の処理）

window.__perf = PERF;

// ---------- 入力（タッチとマウスを pointer イベントでまとめる。押してから 10px 以上動いたらドラッグ） ----------

  if (G.scene === 'close') {
    const R = receiptLayout(L);
    if (receiptReady() && Math.abs(x - R.btn.x) <= R.btn.w / 2 && Math.abs(y - R.btn.y) <= R.btn.h / 2 + 4) { press('next'); nextDay(); }
    else if (!receiptReady()) G.receiptT0 -= 4000;   // タップで打ち出しを早送り
    return;
  }

  if (tg) { press(tg); if (tg === 'sfx') { toggleSfx(); Sound.play('tap'); } else { toggleBgm(); Sound.play('tap'); } return; }
  if (hitCircle(L.btnShop, x, y, 4)) { press('shop'); G.modal = 'shop'; Sound.play('tap'); G.drag = null; return; }

    return;

}
function onMove(x, y) {

  d.x = x; d.y = y;
  if (!d.moved && Math.hypot(x - d.x0, y - d.y0) >= 10) { d.moved = true; Sound.play('pick', { gain: 0.6 }); }
  if (d.moved) { const L = lay(); d.overSeat = seatAt(x, y - L.board.cell * 0.55); d.overTrash = hitCircle(trashPos(), x, y, 8); d.overCell = cellAt(x, y); }

    const t = now();

    else G.lastTap = { cell: d.from, t };

  const r = dropOnCell(d.from, to);

}
function modalDown(L, x, y) {

  if (G.modal === 'shop') {
    for (const cd of shopLayout(L).cards) if (x >= cd.x && x <= cd.x + cd.w && y >= cd.y && y <= cd.y + cd.h) { press('buy:' + cd.key); if (!buy(cd.key)) Sound.play('bad', { gain: 0.5 }); return; }

// ---------- 一時停止・再開（onPause でループ・時計・音・入力を止める。onResume で止めた所から続ける。第1弾と同じ） ----------

  Sound.sync();

}

  G.paused = false; CLOCK.off += performance.now() - CLOCK.at; CLOCK.stopped = false; FX.last = performance.now();

function resize() {

  if (G.scene !== 'play') return true;
  if (G.served >= G.total) return true;
  const w = wanted();
  if (w.some(x => G.board.includes(x.id))) return true;
  if (mergePairs().length) return true;
  const empty = emptyCells().length;
  if (empty && [0, 1, 2].some(c => toolAvailable(c))) return true;   // 回数が 0 でも時間で戻る
  if (G.tray.length && empty) return true;
  return G.board.some(Boolean);   // ゴミ箱に売れば必ず空く
}

(async function boot() {
  Platform.onPause(pauseGame);

  Platform.onAudioEnabledChange(v => { Sound.enabled = v; Sound.sync(); });
