<!-- YouTube Playables SDK。ゲームのコードより前に読み込む決まり。YouTube の外（ローカル）では ytgame が無いか IN_PLAYABLES_ENV=false になり、下の Platform が同じ形のスタブに切り替える -->

<script>
'use strict';
/* =====================================================================
   しきぶちゃんの大そうじブロックくずし（仮）— v1
   仕様は docs/仕様書_v1.md、見た目は docs/アートディレクション_v1.md。
   素の HTML/JS/Canvas。外部通信なし（SDK だけは YouTube が配る）。ブラウザ保存・ページ可視性・ブラウザの言語設定は使わない（tools/build_dist.py が検査）。
   SDK のスタブ・Platform・Save の作法・文字の表・合成の効果音・BGM の仕組み・ドット絵の表（しきぶ・ちらかりオバケ・10円玉・色の表）・
   切替ボタン・一時停止・ループ・大きな絵のカード・テスト用の窓口の形は第4弾（ref/dash-game/index.html）から移植。
   遊ぶ場はドットの世界（横 13 マス × 16 ドット = 208 ドット、縦 240 ドット）で動かし、画面へは整数倍で拡大して描く。
   ===================================================================== */

// ---------- SDK のスタブ（YouTube の外で使う。本物の ytgame と同じ形・同じ戻り値の型。第4弾から移植） ----------
// window.__ytStubInit = { data, lang, audio } で初期状態を渡せる（テスト用）。言語は ?lang= でも変えられる。
function makeStubSdk(init) {
  init = init || {};
  const subs = { pause: [], resume: [], audio: [] };
  const on = (list, cb) => { list.push(cb); return () => { const i = list.indexOf(cb); if (i >= 0) list.splice(i, 1); }; };
  const emit = (list, v) => list.slice().forEach(f => { try { f(v); } catch (e) { /* 呼び出し先の例外で止めない */ } });
  const st = { data: typeof init.data === 'string' ? init.data : '', audio: init.audio !== false, lang: init.lang || new URLSearchParams(location.search).get('lang') || 'ja', score: null };
  const fail = type => { const e = new Error(type); e.errorType = type; return Promise.reject(e); };
  const sdk = {
    IN_PLAYABLES_ENV: false, SDK_VERSION: 'stub',
    game: {
      firstFrameReady() {}, gameReady() {},
      loadData() { return Promise.resolve(st.data); },
      saveData(s) { if (typeof s !== 'string') return fail('INVALID_PARAMS'); if (s.length * 2 > 3 * 1024 * 1024) return fail('SIZE_LIMIT_EXCEEDED'); st.data = s; return Promise.resolve(); },
    },
    system: {
      getLanguage() { return Promise.resolve(st.lang); },
      isAudioEnabled() { return st.audio; },
      onAudioEnabledChange(cb) { return on(subs.audio, cb); },
      onPause(cb) { return on(subs.pause, cb); },
      onResume(cb) { return on(subs.resume, cb); },
    },
    engagement: {
      sendScore(o) { if (!o || !Number.isFinite(o.value)) return fail('INVALID_PARAMS'); st.score = Math.max(st.score || 0, o.value); return Promise.resolve(); },
      openYTContent() { return Promise.resolve(); },
    },
    health: { logError() {}, logWarning() {} },
  };
  sdk.__stub = { state: st, pause: () => emit(subs.pause), resume: () => emit(subs.resume), setAudio: v => { st.audio = !!v; emit(subs.audio, st.audio); } };
  return sdk;
}

// ---------- Platform: ゲームから SDK を呼ぶ唯一の窓口（第4弾から移植） ----------
const Platform = (() => {
  const real = (typeof ytgame !== 'undefined' && ytgame && ytgame.game && ytgame.IN_PLAYABLES_ENV !== false) ? ytgame : null;
  const sdk = real || makeStubSdk(window.__ytStubInit);
  const calls = [];
  const call = (name, f, def) => { calls.push(name); try { return f(); } catch (e) { return def; } };
  const P = {
    env: real ? 'youtube' : 'stub', sdk, calls,
    firstFrameReady() { call('firstFrameReady', () => sdk.game.firstFrameReady()); },
    gameReady() { call('gameReady', () => sdk.game.gameReady()); },
    async getLanguage() { try { return String((await call('getLanguage', () => sdk.system.getLanguage(), '')) || ''); } catch (e) { return ''; } },
    async loadData() { try { const s = await call('loadData', () => sdk.game.loadData(), ''); return typeof s === 'string' ? s : ''; } catch (e) { P.logWarning(); return ''; } },
    saveData(str) { return Promise.resolve(call('saveData', () => sdk.game.saveData(str))).catch(() => P.logWarning()); },
    isAudioEnabled() { return call('isAudioEnabled', () => sdk.system.isAudioEnabled() !== false, true); },
    onAudioEnabledChange(cb) { call('onAudioEnabledChange', () => sdk.system.onAudioEnabledChange(v => cb(!!v))); },
    onPause(cb) { call('onPause', () => sdk.system.onPause(cb)); },
    onResume(cb) { call('onResume', () => sdk.system.onResume(cb)); },
    sendScore(n) { Promise.resolve(call('sendScore', () => sdk.engagement.sendScore({ value: n | 0 }))).catch(() => {}); },
    logError() { call('logError', () => sdk.health.logError()); },
    logWarning() { call('logWarning', () => sdk.health.logWarning()); },
  };
  return P;
})();
window.addEventListener('error', () => Platform.logError());

// ---------- 文字（日英。言語は Platform.getLanguage() だけで決める。ja で始まれば日本語、それ以外は英語） ----------
// tools/build_font.py がこの STR と NAMES から書体に入れる字を拾う。字を足したら流し直す。
const STR = {
  ja: { title1: 'しきぶちゃんの', title2: '大そうじブロックくずし', sub: "Shikibu's Cleanup Bounce", start: 'タップでスタート', cont: 'つづきから {s}',
        howto: '指を左右に動かして おぼんを動かす', launch: 'タップで打ち出す', pause: '一時停止', paused: 'ひとやすみ', resume: 'つづける', map: '部屋へ', next: 'つぎへ', clear: 'CLEAR!',
        sfx: '効果音', bgm: 'BGM', endless: 'おかわり大そうじ', score: 'くずした数 {n}', best: 'ベスト {n}', newBest: 'ベスト更新！', runOver: 'おしまい！',
        allClear: '大そうじ完了！', allClearSub: '25 ステージぜんぶクリア', endlessOpen: '「おかわり大そうじ」が遊べるようになりました',
        combo: '{n} れんぞく', again: 'もういっかい', mapTitle: '部屋の一覧', lost: 'ボールがなくなった…', time: 'タイム {n} 秒', par: 'めやす {n} 秒',
        shine: 'ピカピカ！', visit: '{s}が見に来た！', lap: '{n} 周目', coins: '10円玉', lock: 'まだ' },
  en: { title1: "Shikibu's", title2: 'Cleanup Bounce', sub: 'しきぶちゃんの大そうじブロックくずし', start: 'Tap to start', cont: 'Continue: {s}',
        howto: 'Slide your finger to move the tray', launch: 'Tap to launch', pause: 'Pause', paused: 'Paused', resume: 'Resume', map: 'Rooms', next: 'Next', clear: 'CLEAR!',
        sfx: 'SFX', bgm: 'Music', endless: 'Endless Cleanup', score: 'Cleared {n}', best: 'Best {n}', newBest: 'New best!', runOver: 'Game over!',
        allClear: 'Cleanup complete!', allClearSub: 'All 25 stages cleared', endlessOpen: 'Endless Cleanup is now open',
        combo: '{n} in a row', again: 'Try again', mapTitle: 'Rooms', lost: 'Out of balls...', time: 'Time {n}s', par: 'Target {n}s',
        shine: 'Sparkling!', visit: '{s} came to see!', lap: 'Round {n}', coins: 'Coins', lock: 'Locked' },
};
// 部屋（5 つ。仕様書第4節）・ステージの名前・ブロック・アイテム・敵・見に来る家族の名前（一覧画像でも使う）
const NAMES = {
  ja: { rooms: ['リビング', '台所', '子ども部屋', 'お風呂・洗面所', '玄関'],
        stages: ['ソファ', 'テレビ', '本棚', 'ローテーブル', '窓とカーテン', 'お皿の山', '冷蔵庫', 'おなべ', '台所のテーブル', '食器棚',
                 '積み木の塔', '汽車', '二段ベッド', '勉強机', 'ロケット', '湯船', '洗面台', '洗濯機', 'シャワー', 'タオルの棚',
                 '靴箱', '傘立て', '玄関のドア', '階段', '大そうじの山'],
        blocks: ['ほこり', '服・タオル', '本・雑誌', '段ボール', '家具'],
        items: ['ほうき', 'そうじ機', 'ぞうきん', '10円玉', 'ゴミ袋'],
        enemies: ['目覚まし時計', '靴下', '空き缶', 'レジ袋', '洗濯ばさみ', '丸めたチラシ'],
        fam: ['お母さん', 'お父さん', 'のんたとあたり', '花子', '家族みんな'] },
  en: { rooms: ['Living room', 'Kitchen', "Kids' room", 'Bathroom', 'Entrance'],
        stages: ['Sofa', 'TV', 'Bookshelf', 'Coffee table', 'Window', 'Plate stack', 'Fridge', 'Pot', 'Kitchen table', 'Cupboard',
                 'Block tower', 'Toy train', 'Bunk bed', 'Study desk', 'Rocket', 'Bathtub', 'Sink', 'Washer', 'Shower', 'Towel shelf',
                 'Shoe rack', 'Umbrella stand', 'Front door', 'Stairs', 'The big pile'],
        blocks: ['Dust', 'Clothes', 'Books', 'Cardboard box', 'Furniture'],
        items: ['Broom', 'Vacuum', 'Rag', 'Coin', 'Trash bag'],
        enemies: ['Alarm clock', 'Sock', 'Empty can', 'Plastic bag', 'Clothespin', 'Crumpled flyer'],
        fam: ['Mom', 'Dad', 'Nonta & Atari', 'Hanako', 'The whole family'] },
};
let LANG = 'en';
function langOf(tag) { return String(tag || '').toLowerCase().startsWith('ja') ? 'ja' : 'en'; }
function T(k, vars) { let s = (STR[LANG] || STR.en)[k]; if (s == null) s = STR.en[k] != null ? STR.en[k] : k; if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; }
const NM = (kind, i) => (NAMES[LANG] || NAMES.en)[kind][i];
const roomName = r => NM('rooms', r);

// ---------- 小さな道具（第4弾から） ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// 第1弾と同じ mulberry32
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = Math.random;   // 演出の揺れだけに使う。テストは Game.seed(n) で固定できる
// ゲームの時計（一時停止中は止まる）
const CLOCK = { off: 0, at: 0, stopped: false, skew: 0 };
const now = () => (CLOCK.stopped ? CLOCK.at : performance.now()) - CLOCK.off + CLOCK.skew;
const FX = { t: 0, last: 0 };
const fxNow = () => FX.t;
function hexRgb(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mixHex(a, b, k) { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => clamp(Math.round(lerp(v, B[i], k)), 0, 255).toString(16).padStart(2, '0')).join(''); }

// ---------- ステージの番号 ----------
const ROOMS = 5, PER_ROOM = 5, LAST = ROOMS * PER_ROOM;      // 25 ステージ（1-1〜5-5）
const stageId = n => Math.floor((n - 1) / PER_ROOM) + 1 + '-' + ((n - 1) % PER_ROOM + 1);   // n = 1〜25
const roomOf = n => Math.floor((n - 1) / PER_ROOM);
const ENDLESS = 99;   // おかわり大そうじ

// ---------- セーブ（saveData/loadData に JSON 文字列 1 つ。第4弾の Save の作法を移植して中身をこのゲーム用に） ----------
// 形式 v1: { v, cleared{ "1-1": { stars, coins, best_time } }, total_coins, best_endless, settings{ sfx, bgm }, stats{} }（仕様書第10節）
// 壊れた・型違いのセーブは項目ごとに既定値へ落とす（落ちない）。loadData が済むまで saveData は呼ばない。25 ステージ分でも 2KB 程度。
const SAVE_VER = 1;
const int = (v, lo, hi, def) => Number.isInteger(v) && v >= lo && v <= hi ? v : def;
const num = (v, lo, hi, def) => Number.isFinite(v) && v >= lo && v <= hi ? v : def;
function freshStats() { return { plays: 0, clears: 0, fails: 0, drops: 0, breaks: 0, ghosts: 0, items: 0, playMs: 0, runs: 0 }; }
const Save = {
  data: null, loaded: false, timer: 0, writes: 0, lastLen: 0,
  parse(raw) {
    let o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    const cl = (o.cleared && typeof o.cleared === 'object' && !Array.isArray(o.cleared)) ? o.cleared : {};
    const cleared = {};
    for (let n = 1; n <= LAST; n++) {
      const c = cl[stageId(n)];
      if (!c || typeof c !== 'object' || Array.isArray(c)) continue;
      cleared[stageId(n)] = { stars: int(c.stars, 1, 3, 1), coins: int(c.coins, 0, 9999, 0), best_time: Math.round(num(c.best_time, 0, 9999, 999) * 10) / 10 };
    }
    const s = (o.stats && typeof o.stats === 'object' && !Array.isArray(o.stats)) ? o.stats : {};
    const stats = freshStats();
    for (const k in stats) if (Number.isFinite(s[k]) && s[k] >= 0) stats[k] = s[k];
    return {
      v: SAVE_VER, cleared, stats, total_coins: int(o.total_coins, 0, 1e9, 0), best_endless: int(o.best_endless, 0, 1e9, 0),
      fresh: !raw || !Object.keys(o).length,
      settings: { sfx: !(o.settings && o.settings.sfx === false), bgm: !(o.settings && o.settings.bgm === false) },
    };
  },
  build() {
    return { v: SAVE_VER, cleared: G.cleared, total_coins: G.totalCoins, best_endless: G.bestEndless, settings: { sfx: !Sound.userMuted, bgm: Sound.bgmOn }, stats: G.stats };
  },
  async load() { this.data = Save.parse(await Platform.loadData()); this.loaded = true; return this.data; },
  flush() {
    if (!this.loaded) return;
    const s = JSON.stringify(this.build()); this.lastLen = s.length; this.writes++;
    Platform.saveData(s);
  },
};
function applySave(d) { G.cleared = d.cleared; G.totalCoins = d.total_coins; G.bestEndless = d.best_endless; G.stats = d.stats; }

// ---------- 音（効果音はファミコン風の合成音。四角い波・三角の波・雑音を Web Audio で作る。第4弾と同じ作り方） ----------
// enabled = YouTube 側の音声（isAudioEnabled）。一時停止中・YouTube ミュート中は AudioContext ごと止める（効果音も BGM も）。
// userMuted = 効果音の設定・bgmOn = BGM の設定（それぞれのボタン。セーブの settings.sfx・settings.bgm）。
// BGM（assets/bgm.js。第4弾と同じ仕組み）: v1 は曲が無い（仕様書第10節。あとで本人が Suno で作る）。HAS_BGM = false の間は BGM のボタンを隠し、
// 曲のデータ（assets/bgm_data.js）を足して HAS_BGM = true にすれば、タイトルと部屋の一覧 = title・遊ぶ間 = main・クリア = clear のジングルで鳴る。
const HAS_BGM = false;
const Sound = {
  ctx: null, enabled: true, userMuted: false, bgmOn: true, tones: 0, last: null, out: null, noise: null,
  bgmLoaded: false, bgmLoading: null,
  setup() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.out = c.createGain(); this.out.gain.value = 0.5; this.out.connect(c.destination);
    BGM.init(c);   // 設定（bgmOn）を読むまでは出口 0
    const parsed = new Promise(res => { if (document.readyState !== 'loading') res(); else document.addEventListener('DOMContentLoaded', res, { once: true }); });
    this.bgmLoading = parsed.then(() => BGM.load(HAS_BGM && typeof BGM_DATA !== 'undefined' ? BGM_DATA : null)).then(() => { this.bgmLoaded = true; }).catch(() => {});
    const len = Math.floor(c.sampleRate * 0.5), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let x = 0x1234; for (let i = 0; i < len; i++) { x ^= x << 7; x ^= x >> 9; x &= 0xFFFF; d[i] = (x & 1) ? 0.8 : -0.8; }   // ファミコンの雑音のような 1 ビットの雑音
    this.noise = buf;
  },
  unlock() { this.setup(); this.sync(); },
  sync() { const c = this.ctx; if (!c) return; if (G.paused || !this.enabled) { if (c.state === 'running') c.suspend().catch(() => {}); } else if (c.state === 'suspended') c.resume().catch(() => {}); },
  on() { return this.enabled && !this.userMuted && !G.paused && this.ctx; },
  setBgm(on, instant) { this.bgmOn = !!on; BGM.setOn(HAS_BGM && this.bgmOn, instant); return this.bgmOn; },
  music(name) {
    if (!this.ctx || !HAS_BGM) return null;
    const heard = this.ctx.state === 'running' && this.ctx.currentTime > 0.05, t = this.ctx.currentTime;
    const o = BGM.cur ? { fade: heard ? BGM.XFADE : 0 } : {};
    if (BGM.jingleEnd > t && !BGM.cur) { o.when = BGM.jingleEnd; o.fade = BGM.XFADE; }
    return BGM.play(name, o);
  },
  jingle() {
    if (!this.ctx || !HAS_BGM || !this.enabled || G.paused || !BGM.has('clear')) return null;
    BGM.stop({ fade: 0.25 });
    return BGM.jingle('clear', { duck: false });
  },
  // 1 音: type = square / triangle / noise。f0 → f1 へ滑らせる
  tone(type, f0, f1, dur, gain, delay) {
    const c = this.ctx, t0 = c.currentTime + (delay || 0), g = c.createGain();
    g.gain.setValueAtTime(gain, t0); g.gain.setValueAtTime(gain, t0 + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    let src;
    if (type === 'noise') { src = c.createBufferSource(); src.buffer = this.noise; src.loop = true; src.playbackRate.setValueAtTime(f0, t0); if (f1 !== f0) src.playbackRate.linearRampToValueAtTime(f1, t0 + dur); }
    else { src = c.createOscillator(); src.type = type; src.frequency.setValueAtTime(f0, t0); if (f1 !== f0) src.frequency.exponentialRampToValueAtTime(f1, t0 + dur); }
    src.connect(g); g.connect(this.out); src.start(t0); src.stop(t0 + dur + 0.02);
  },
  notes(type, fs, step, gain, dur, delay) { fs.forEach((f, i) => { if (f) this.tone(type, f, f, dur || step * 0.9, gain, (delay || 0) + i * step); }); },
  play(role, arg) {
    if (!this.on()) return null;
    const S = this, k = Math.pow(2, Math.min(8, Math.max(0, (arg || 1) - 1)) / 12);   // れんぞくで半音ずつ上がる（上限 8）
    switch (role) {
      case 'pon': S.tone('triangle', 520, 400, 0.08, 0.35); S.tone('square', 1040, 1040, 0.03, 0.05); break;               // おぼん: ポン
      case 'wall': S.tone('square', 880, 880, 0.02, 0.035); break;                                                        // 壁: 小さくコッ
      case 'fuwa': S.tone('noise', 0.28 * k, 0.12 * k, 0.14, 0.13); S.tone('triangle', 620 * k, 930 * k, 0.1, 0.16); break;   // ほこり・布: ふわ
      case 'pata': S.tone('noise', 1.1 * k, 0.6 * k, 0.05, 0.14); S.tone('square', 330 * k, 220 * k, 0.07, 0.09); break;       // 本: パタ
      case 'boko': S.tone('triangle', 170 * k, 90 * k, 0.14, 0.4); S.tone('noise', 0.45, 0.3, 0.07, 0.12); break;            // 段ボール: ボコ
      case 'dent': S.tone('triangle', 330, 260, 0.05, 0.22); S.tone('noise', 0.8, 0.8, 0.02, 0.06); break;                  // まだ崩れない物に当たる
      case 'kon': S.tone('square', 1320, 1320, 0.025, 0.05); S.tone('triangle', 780, 700, 0.05, 0.18); break;              // 家具: コン
      case 'poko': S.tone('triangle', 700 * k, 180 * k, 0.12, 0.35); S.tone('noise', 1.2, 0.5, 0.05, 0.08); break;          // オバケ: ポコッ
      case 'coin': S.tone('square', 988, 988, 0.06, 0.08); S.tone('square', 1319, 1319, 0.2, 0.08, 0.06); break;            // チャリン
      case 'item': S.notes('square', [523, 659, 784, 1047], 0.05, 0.09, 0.06); break;                                     // アイテムを取る: 上がる音
      case 'launch': S.tone('square', 330, 760, 0.12, 0.1); break;
      case 'last': S.notes('square', [784, 988, 1175, 1568], 0.07, 0.09, 0.09); S.notes('triangle', [392, 494, 587, 784], 0.07, 0.25, 0.12); break;   // 最後の 1 個: 短いファンファーレ
      case 'drop': S.tone('square', 880, 140, 0.55, 0.1); break;                                                          // ボールを落とす
      case 'fail': S.notes('square', [659, 523, 440, 330], 0.12, 0.1, 0.14); break;
